<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../dev-storage-scope.js?v=20261102-olympia-v2-session"></script>
<title>UPPSLAG · ALEA DEV</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#151310;color:#f1e5d1;--gold:#e6bd76}*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:14px}h1{font:clamp(34px,8vw,46px) Georgia,serif;color:var(--gold);margin:12px 0}header,.top,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:var(--gold)}button,input,select,textarea{font:inherit;border:1px solid #8b6c43;border-radius:8px;padding:10px;background:#2b241d;color:#f1e5d1}button{min-height:44px;cursor:pointer}input,textarea{width:100%}textarea{min-height:105px}label{display:block;margin:10px 0 4px}.muted{color:#bdb1a2;font-size:13px}table{width:100%;border-collapse:collapse}th,td{padding:11px 6px;border-bottom:1px solid #594832;text-align:left;vertical-align:top}th{font-size:12px;color:#c7b9a5}details summary{cursor:pointer;font-weight:600}details[open] summary{color:var(--gold)}td select{width:65px;padding:7px}.detail{padding:10px 0}.detail p{white-space:pre-wrap;overflow-wrap:anywhere}.panel{background:#211c17;border:1px solid #735737;border-radius:12px;padding:15px;margin-top:16px}.hidden{display:none}#message{min-height:26px;color:var(--gold)}.actions{justify-content:flex-start}button.danger{border-color:#ad6458}@media(max-width:480px){body{padding:10px}th,td{padding:9px 4px;font-size:14px}}
</style></head><body>
<header><div><small class="muted">ALEA DEV</small><h1>UPPSLAG</h1></div><a href="./index.html">Till OLYMPIA</a></header>
<div class="top"><p class="muted">Idébank · prioritet 1 är högst</p><button id="new">+ Nytt uppslag</button></div>
<p id="message" role="status">Läser uppslag…</p>
<table><thead><tr><th>Namn</th><th>Prio</th><th>Historisk PR</th></tr></thead><tbody id="rows"><tr><td colspan="3">Läser…</td></tr></tbody></table>
<section id="editor" class="panel hidden"><h2 id="heading">Nytt uppslag</h2><form id="form">
<label for="title">Namn</label><input id="title" required maxlength="160">
<label for="description">Syfte och bakgrund</label><textarea id="description" maxlength="4000"></textarea>
<label for="priority">Prioritet</label><select id="priority"><option>1</option><option selected>2</option><option>3</option></select>
<label for="pr">Historisk PR (valfri)</label><input id="pr" type="number" min="1" inputmode="numeric">
<div class="actions"><button type="submit">Spara</button><button id="cancel" type="button">Avbryt</button></div></form></section>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), root='https://wkiuyklzzroavclnsxna.supabase.co', key='sb_publishable_LEWEgrZpK5hktEw6UPCAog_zB2R83et';
let rows=[],user=null,token='',editing=null,busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=t=>$('message').textContent=t;
function getSession(){for(const name of ['alea_supabase_session_dev','alea_supabase_session']){try{const s=JSON.parse(localStorage.getItem(name)||'null');if(s?.access_token)return s}catch(_){}}return null}
async function request(path,options={}){const res=await fetch(root+path,{...options,headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers}});if(!res.ok){const data=await res.json().catch(()=>({}));throw Error(data.message||data.error_description||'HTTP '+res.status)}if(res.status===204)return null;return res.json()}
async function start(){try{const s=getSession();if(!s)throw Error('Logga in via ALEA DEV och öppna sidan igen.');token=s.access_token;user=await request('/auth/v1/user');if(!user?.id)throw Error('DEV-sessionen behöver förnyas.');await load()}catch(e){notice('Kunde inte öppna uppslagen: '+e.message);$('rows').innerHTML='<tr><td colspan="3">Inläsningen misslyckades.</td></tr>'}}
async function load(){try{rows=await request('/rest/v1/olympia_ideas?select=*&order=priority.asc,title.asc');render();notice(rows.length+' uppslag')}catch(e){notice('Kunde inte läsa uppslag: '+e.message);$('rows').innerHTML='<tr><td colspan="3">Inläsningen misslyckades.</td></tr>'}}
function render(){const sorted=[...rows].sort((a,b)=>(a.priority||2)-(b.priority||2)||a.title.localeCompare(b.title,'sv'));$('rows').innerHTML=sorted.length?sorted.map(i=>{const prs=i.historical_prs||[],protectedRow=prs.length>0||!!i.import_source||!!i.active_pr_number;return '<tr><td><details><summary>'+esc(i.title)+'</summary><div class="detail"><p>'+esc(i.description||'Ingen beskrivning')+'</p><p class="muted">Registrerad '+esc((i.created_at||'').slice(0,10))+'</p><div class="actions"><button data-edit="'+esc(i.id)+'">Redigera</button>'+(protectedRow?'':'<button class="danger" data-delete="'+esc(i.id)+'">Ta bort</button>')+'</div></div></details></td><td><select data-priority="'+esc(i.id)+'" aria-label="Prioritet för '+esc(i.title)+'">'+[1,2,3].map(n=>'<option value="'+n+'"'+((i.priority||2)===n?' selected':'')+'>'+n+'</option>').join('')+'</select></td><td>'+prs.map(p=>'<a target="_blank" rel="noopener" href="https://github.com/lindkvistfoto-dot/alea-crusaders/pull/'+Number(p.number)+'">#'+Number(p.number)+'</a>').join(', ')+'</td></tr>'}).join(''):'<tr><td colspan="3" class="muted">Inga uppslag ännu.</td></tr>'}
function edit(i){editing=i||null;$('heading').textContent=i?'Redigera uppslag':'Nytt uppslag';$('title').value=i?.title||'';$('description').value=i?.description||'';$('priority').value=String(i?.priority||2);$('pr').value=i?.historical_prs?.[0]?.number||'';$('pr').disabled=Boolean(i?.historical_prs?.length);$('editor').classList.remove('hidden');$('editor').scrollIntoView({block:'nearest'})}
async function update(i,fields){const match='id=eq.'+encodeURIComponent(i.id)+'&updated_at=eq.'+encodeURIComponent(i.updated_at);const result=await request('/rest/v1/olympia_ideas?'+match,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({...fields,updated_at:new Date().toISOString(),updated_by:user.id})});if(!result.length)throw Error('Uppslaget har ändrats. Ladda om sidan.')}
$('new').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').classList.add('hidden');
$('form').onsubmit=async e=>{e.preventDefault();if(busy||!user)return;busy=true;try{const fields={title:$('title').value.trim(),description:$('description').value.trim(),priority:Number($('priority').value)};if(!fields.title)throw Error('Ange namn.');if(editing){await update(editing,fields)}else{const n=Number($('pr').value);const historical_prs=n>0?[{number:n,url:'https://github.com/lindkvistfoto-dot/alea-crusaders/pull/'+n,purpose:fields.description||fields.title,classification:'uncertain',remaining_need:'',recommendation:'Granska före bearbetning',hidden:false}]:[];await request('/rest/v1/olympia_ideas',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({...fields,historical_prs,status:'idea_bank',created_by:user.id,updated_by:user.id})})}$('editor').classList.add('hidden');await load();notice('Sparat.')}catch(err){notice('Kunde inte spara: '+err.message)}finally{busy=false}};
$('rows').onchange=async e=>{const sel=e.target.closest('[data-priority]');if(!sel)return;const i=rows.find(x=>x.id===sel.dataset.priority);if(!i)return;try{await update(i,{priority:Number(sel.value)});await load();notice('Prioritet sparad.')}catch(err){notice('Kunde inte ändra prioritet: '+err.message);render()}};
$('rows').onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;const i=rows.find(x=>x.id===(btn.dataset.edit||btn.dataset.delete));if(!i)return;if(btn.dataset.edit){edit(i);return}if(btn.dataset.delete&&!i.import_source&&!(i.historical_prs||[]).length&&!i.active_pr_number&&confirm('Ta bort uppslaget?')){try{await request('/rest/v1/olympia_ideas?id=eq.'+encodeURIComponent(i.id),{method:'DELETE'});await load()}catch(err){notice('Kunde inte ta bort: '+err.message)}}};
start();
})();
</script></body></html>
