<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../dev-storage-scope.js?v=20261102-olympia-v2-session"></script>
<title>OLYMPIA · UPPSLAG</title>
<style>
:root{font:16px system-ui,sans-serif;color:#f0e3cc;background:#151310;--gold:#e6bd76}*{box-sizing:border-box}body{margin:0 auto;padding:16px;max-width:850px}h1{font:38px Georgia,serif;color:var(--gold);margin:12px 0}a{color:var(--gold)}button,input,select,textarea{font:inherit;border:1px solid #80633e;border-radius:8px;padding:10px;color:#f0e3cc;background:#30271f}button{cursor:pointer;min-height:44px}input,textarea{width:100%}textarea{min-height:110px}label{display:block;margin:12px 0 4px}header,.toolbar,.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}main{margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid #594832;padding:12px 6px;text-align:left;vertical-align:top}.table th{font-size:12px;color:#c8bba8}.table summary{cursor:pointer;font-weight:600}.table details[open] summary{color:var(--gold)}.table select{width:65px;padding:7px}.detail{padding:10px 0}.detail p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#b8aa97;font-size:13px}.panel{background:#211c17;border:1px solid #735737;border-radius:12px;padding:15px;margin-top:15px}.hidden{display:none}#message{min-height:24px;color:#e6bd76}.actions{justify-content:flex-start;margin-top:14px}button.danger{border-color:#a65f55}button:disabled{opacity:.5}@media(max-width:480px){body{padding:10px}.table td,.table th{padding:10px 4px;font-size:14px}}
</style></head><body>
<header><div><small class="muted">ALEA DEV · OLYMPIA 2.0</small><h1>UPPSLAG</h1></div><a href="./index.html">Till OLYMPIA</a></header>
<div class="toolbar"><p class="muted">Idébank · prioritet 1 är högst</p><button id="new">+ Nytt uppslag</button></div>
<p id="message" role="status" aria-live="polite">Läser uppslag…</p>
<main><table class="table"><thead><tr><th>Namn</th><th>Prio</th><th>Historisk PR</th></tr></thead><tbody id="rows"><tr><td colspan="3">Läser…</td></tr></tbody></table></main>
<section id="editor" class="panel hidden"><h2 id="heading">Nytt uppslag</h2><form id="form">
<label for="title">Namn</label><input id="title" required maxlength="160">
<label for="description">Syfte och bakgrund</label><textarea id="description" maxlength="4000"></textarea>
<label for="priority">Prioritet</label><select id="priority"><option>1</option><option selected>2</option><option>3</option></select>
<label for="pr">Historisk PR (valfri)</label><input id="pr" type="number" min="1" inputmode="numeric">
<div class="actions"><button type="submit">Spara</button><button id="cancel" type="button">Avbryt</button></div></form></section>
<script src="./dev-approval.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ideas=[],editing=null,busy=false;
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async action=>{if(!window.olympiaV2Request)throw Error('DEV-sessionen är inte klar.');return window.olympiaV2Request(action)};
const message=t=>$('message').textContent=t;
function render(){const sorted=[...ideas].sort((a,b)=>(a.priority||2)-(b.priority||2)||a.title.localeCompare(b.title,'sv'));$('rows').innerHTML=sorted.length?sorted.map(i=>{
const prs=i.historical_prs||[];const pr=prs.map(p=>'<a href="https://github.com/lindkvistfoto-dot/alea-crusaders/pull/'+Number(p.number)+'" target="_blank" rel="noopener">#'+Number(p.number)+'</a>').join(', ')||'—';
const protectedIdea=prs.length>0||Boolean(i.import_source)||Boolean(i.active_pr_number);
return '<tr><td><details><summary>'+escapeHtml(i.title)+'</summary><div class="detail"><p>'+escapeHtml(i.description||'Ingen beskrivning')+'</p><p class="muted">Skapad: '+escapeHtml((i.created_at||'').slice(0,10))+'</p><div class="actions"><button data-edit="'+escapeHtml(i.id)+'">Redigera</button>'+(protectedIdea?'':'<button class="danger" data-delete="'+escapeHtml(i.id)+'">Ta bort</button>')+'</div></div></details></td><td><select aria-label="Prioritet för '+escapeHtml(i.title)+'" data-priority="'+escapeHtml(i.id)+'">'+[1,2,3].map(n=>'<option value="'+n+'"'+((i.priority||2)===n?' selected':'')+'>'+n+'</option>').join('')+'</select></td><td>'+pr+'</td></tr>'}).join(''):'<tr><td colspan="3" class="muted">Inga uppslag ännu.</td></tr>'}
async function load(){if(!window.olympiaV2ZeusVerified)return;try{const r=await api({action:'idea_list'});ideas=r.ideas||[];render();message(ideas.length+' uppslag')}catch(e){message('Kunde inte läsa uppslag: '+e.message)}}
function edit(i){editing=i||null;$('heading').textContent=i?'Redigera uppslag':'Nytt uppslag';$('title').value=i?.title||'';$('description').value=i?.description||'';$('priority').value=String(i?.priority||2);$('pr').value=i?.historical_prs?.[0]?.number||'';$('pr').disabled=Boolean(i?.historical_prs?.length);$('editor').classList.remove('hidden');$('editor').scrollIntoView({block:'nearest'})}
async function save(i,priority){const historical=i?.historical_prs||[];const number=Number($('pr').value);const prs=historical.length?historical:(number>0?[{number,purpose:$('description').value||$('title').value,classification:'uncertain',remaining_need:'',recommendation:'Granska före bearbetning',hidden:false}]:[]);return api({action:'idea_save',id:i?.id,expectedUpdatedAt:i?.updated_at,title:$('title').value,description:$('description').value,priority,status:'idea_bank',historical_prs:prs})}
$('new').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').classList.add('hidden');
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{await save(editing,Number($('priority').value));$('editor').classList.add('hidden');await load();message('Sparat.')}catch(e){message('Kunde inte spara: '+e.message)}finally{busy=false}};
$('rows').onchange=async e=>{const node=e.target.closest('[data-priority]');if(!node)return;const i=ideas.find(x=>x.id===node.dataset.priority);if(!i)return;try{await api({action:'idea_save',id:i.id,expectedUpdatedAt:i.updated_at,title:i.title,description:i.description,priority:Number(node.value),status:'idea_bank',historical_prs:i.historical_prs||[]});await load();message('Prioritet sparad.')}catch(err){message('Kunde inte ändra prioritet: '+err.message);render()}};
$('rows').onclick=async e=>{const btn=e.target.closest('button');if(!btn)return;const i=ideas.find(x=>x.id===(btn.dataset.edit||btn.dataset.delete));if(!i)return;if(btn.dataset.edit){edit(i);return}if(btn.dataset.delete&&confirm('Ta bort uppslaget?')){try{await api({action:'idea_delete',id:i.id,expectedUpdatedAt:i.updated_at});await load()}catch(err){message('Kunde inte ta bort: '+err.message)}}};
window.addEventListener('olympia-v2-auth-ready',load);setTimeout(load,0);
})();
</script></body></html>
