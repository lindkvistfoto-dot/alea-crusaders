<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../dev-storage-scope.js?v=20261102-olympia-v2-session"></script><title>OLYMPIA 2.0 · DEV-pilot</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#151310;color:#f0e3cc}*{box-sizing:border-box}body{margin:0;padding:16px;max-width:920px;margin-inline:auto}h1,h2{font-family:Georgia,serif;color:#e6bd76}h1{margin:.2em 0}small,.muted{color:#bdb3a4}.panel{border:1px solid #735737;border-radius:16px;background:#201c18;padding:16px;margin:14px 0}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border:1px solid #8c744f;border-radius:30px;padding:7px 12px}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:18px 0}.step{border-top:5px solid #595550;padding-top:9px;font-size:12px;text-align:center;color:#bdb3a4}.step.done{border-color:#3ea776;color:#c2f4d8}.step.current{border-color:#e5b95d;color:#f2d9a2}.ci{display:flex;gap:12px;flex-wrap:wrap}.ci>span{border:1px solid #695a46;border-radius:9px;padding:10px;flex:1;min-width:130px}.good{color:#7fdfaa}.wait{color:#e9bf68}.bad{color:#fa9790}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}button,a.action{font:inherit;border:1px solid #947349;border-radius:10px;background:#3a2d20;color:#f1d6a6;padding:12px;text-align:center;text-decoration:none}button:disabled{opacity:.4;cursor:not-allowed}a.action{display:block}.notice{padding:12px;border-left:4px solid #e5b95d;background:#2b251c;margin:12px 0}select{background:#2c251e;color:#fff;border:1px solid #8b704d;border-radius:8px;padding:10px;max-width:100%}.preview{display:flex;gap:10px;flex-wrap:wrap}.preview>*{flex:1;min-width:140px}#cards:empty:before{content:"Inga ärenden hämtade."}a{color:#f0c879}button:focus-visible,a:focus-visible{outline:3px solid #f7d18b}@media(max-width:480px){body{padding:10px}.panel{padding:13px}.step{font-size:10px}.actions{grid-template-columns:1fr}}
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.lane{border:1px solid #72583a;border-radius:12px;padding:14px;background:#191613}.lane h3{margin-top:0}.lane .actions{grid-template-columns:1fr}@media(max-width:650px){.lanes{grid-template-columns:1fr}}</style></head><body>
<header class="header"><div><small>ALEA ADMIN · PILOT / ENDAST LÄSNING</small><h1>OLYMPIA 2.0</h1><p class="muted">En PR · ett kort · en verifierad status</p></div><a href="../" class="action">Till ALEA DEV</a></header>
<section class="panel"><div class="header"><strong>GitHub-status</strong><button id="refresh" type="button">Uppdatera status</button></div><p id="global" role="status" aria-live="polite">Läser aktuella PR…</p><label>Visa PR <select id="filter"><option value="all">Alla öppna DEV-PR</option></select></label></section>
<p id="zeus-session" class="notice" role="status">Kontrollerar Zeus-behörighet…</p><main id="cards" aria-label="PR-kort"></main>
<footer class="muted">V2-pilot: inga godkännanden, merges eller publiceringar kan utföras här. V1 är orörd.</footer>
<script>
(()=>{'use strict';
const base='https://api.github.com/repos/lindkvistfoto-dot/alea-crusaders',cards=document.querySelector('#cards'),global=document.querySelector('#global'),filter=document.querySelector('#filter');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path){const response=await fetch(base+path,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!response.ok)throw Error('GitHub HTTP '+response.status);return response.json()}
function ci(checks,status){const runs=checks.check_runs||[],statuses=status.statuses||[];if(!runs.length&&!statuses.length)return ['unknown','Status saknas'];if(runs.some(x=>x.status!=='completed')||(statuses.length>0&&status.state==='pending'))return ['pending','Tester pågår'];if(runs.some(x=>!['success','neutral','skipped'].includes(x.conclusion))||status.state==='failure'||status.state==='error')return ['failed','Tester underkända'];return ['success','Godkänd']}
function step(name,state){return '<div class="step '+state+'">'+safe(name)+'</div>'}
function link(url,label){return url?'<a class="action" target="_blank" rel="noopener noreferrer" href="'+safe(url)+'">'+safe(label)+' ↗</a>':'<button disabled>'+safe(label)+' · ej tillgänglig</button>'}
async function card(pr){const id=pr.number,sha=pr.head.sha;
if(pr.merged_at){return '<article class="panel" data-pr="'+id+'"><div class="header"><div><small>PR #'+id+' · development</small><h2>'+safe(pr.title)+'</h2></div><span class="pill good">För publicering</span></div><div class="progress">'+step('Skapad','done')+step('Testad','done')+step('DEV','done')+step('LIVE-kandidat','current')+step('Publicerad','')+'</div><p class="notice">DEV-merge bekräftad · <code style="overflow-wrap:anywhere">'+safe((pr.merge_commit_sha||'GitHub').slice(0,12))+'</code>. Väntar på LIVE-förberedelse.</p><div class="lanes"><section class="lane"><h3>DEV</h3><p class="good">✓ Godkänd och mergad</p></section><section class="lane"><h3>LIVE</h3><p class="wait">Förbered releasekandidat utan att publicera LIVE</p><button type="button" data-live-accept="'+id+'" '+(!window.olympiaV2ZeusVerified?'disabled':'')+'>Godkänn DEV-underlag för LIVE</button><button type="button" data-live-pandora="'+id+'" disabled>Öppna Pandoras ask</button><p class="muted">LIVE-publicering kräver separat verifiering och godkännande.</p></section></div>'+link(pr.html_url,'Visa PR på GitHub')+'</article>'}
const details=await window.olympiaV2Request({action:'pull_request_status',pullRequestNumber:id,pullRequestHeadSha:sha});const checks={check_runs:details.checkRuns||[]},status={statuses:details.statuses||[],state:details.statuses?.length?'pending':'success'};const [state,label]=ci(checks,status);const cloud=(checks.check_runs||[]).find(x=>/cloudflare pages/i.test(x.name));const raw=cloud?.output?.summary||'';const url=(raw.match(/https:\/\/[a-z0-9-]+\.alea-crusaders\.pages\.dev(?:\/[^\s<'"]*)?/i)||[])[0]||null;const ready=state==='success';const stage=ready?'För granskning':state==='pending'?'Tester pågår':state==='failed'?'Tester underkända':'Väntar på CI';return '<article class="panel" data-pr="'+id+'"><div class="header"><div><small>PR #'+id+' · '+safe(pr.base.ref)+'</small><h2>'+safe(pr.title)+'</h2></div><span class="pill">'+safe(stage)+'</span></div><div class="progress">'+step('Skapad','done')+step('Testad',ready?'done':'current')+step('DEV',ready?'current':'')+step('LIVE-kandidat','')+step('Publicerad','')+'</div><div class="notice" role="status">'+safe(ready?'Väntar på Zeus DEV-beslut.':state==='pending'?'Tester körs – inväntar GitHub.':label)+'</div><div class="lanes"><section class="lane"><h3>DEV · Granskning</h3><div class="ci"><span>CI DEV <strong class="'+(ready?'good':state==='failed'?'bad':'wait')+'">'+safe(label)+'</strong></span></div>'+link(url,'Förhandsvisa DEV')+'<div class="actions"><button type="button" data-dev-approve="'+id+'" data-head-sha="'+safe(sha)+'" '+(!ready||!window.olympiaV2ZeusVerified?'disabled':'')+'>Godkänn DEV</button><button disabled>Omarbeta</button><button disabled>Avslå</button></div></section><section class="lane"><h3>LIVE · Publicering</h3><div class="ci"><span>CI LIVE <strong class="muted">Ej startad</strong></span></div>'+link(null,'Förhandsvisa LIVE')+'<div class="actions"><button disabled>Öppna Pandoras ask</button><button disabled>Lägg i releasepaket</button><button disabled>Till Hefaiastos</button><button disabled>Till Karon</button><button disabled>Slutgodkänn LIVE</button></div></section></div><p class="muted">Commit: <code>'+safe(sha.slice(0,10))+'</code> · Källa: GitHub</p><p class="muted">DEV-beslut kräver verifierad Zeus-session och godkänd CI. LIVE-beslut är ännu inte aktiverade.</p>'+link(pr.html_url,'Visa PR på GitHub')+'</article>'}
async function refresh(){
 const refreshButton=document.querySelector('#refresh');refreshButton.disabled=true;
 global.textContent='Hämtar PR via ALEA DEV…';
 try{
  if(!window.olympiaV2Request)throw Error('ALEA DEV-anslutningen är inte klar');
  const data=await window.olympiaV2Request({action:'pull_request_list'});
  const prs=(data.pullRequests||[]).filter(p=>p.base?.ref==='development'&&(p.state==='open'||p.merged||p.merged_at)).sort((a,b)=>Date.parse(b.updated_at||0)-Date.parse(a.updated_at||0)||b.number-a.number);
  const selected=filter.value;
  filter.innerHTML='<option value="all">Aktuella DEV-PR</option>'+prs.map(p=>'<option value="'+p.number+'">#'+p.number+' · '+safe(p.title)+'</option>').join('');
  filter.value=prs.some(p=>String(p.number)===selected)?selected:'all';
  const shown=prs.filter(p=>filter.value==='all'||String(p.number)===filter.value);
  const results=await Promise.allSettled(shown.map(card));
  cards.innerHTML=results.map((r,i)=>r.status==='fulfilled'?r.value:'<section class="panel">PR #'+shown[i].number+': status kunde inte hämtas. '+safe(r.reason?.message)+'</section>').join('');
  global.textContent=prs.length+' DEV-ärenden · uppdaterad '+new Date().toLocaleTimeString('sv-SE');
 }catch(error){global.textContent='PR-listan kunde inte uppdateras: '+error.message+'.';}
 finally{refreshButton.disabled=false}
}
let refreshing=false,lastRefreshAt=0;async function automaticRefresh(){if(refreshing||document.hidden)return;refreshing=true;try{await refresh();lastRefreshAt=Date.now()}finally{refreshing=false}}
setInterval(automaticRefresh,120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRefreshAt>120000)automaticRefresh()});
window.olympiaV2Refresh=refresh;filter.addEventListener('change',refresh);document.querySelector('#refresh').addEventListener('click',refresh);
})();
</script><script src="./dev-approval.js"></script></body></html>
