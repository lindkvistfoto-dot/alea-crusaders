<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcane Morphing Frame – synthetic authenticated-role smoke</title>
<link rel="stylesheet" href="/features/material/arcane-gallery.css">
<style>
body{margin:0;background:#101720;color:#e7ce9d;font:14px system-ui}
#legolasPanel{max-width:820px;margin:auto;padding:10px}
.hidden{display:none!important}
#result{white-space:pre-wrap}
</style>
</head>
<body>
<div id="legolasPanel"><div id="playerTarget"></div><div id="gmTarget"></div><pre id="result">Running smoke…</pre></div>
<script type="module">
import {createArcaneGallery} from '/features/material/arcane-gallery.js';
const campaign='846e8089-24da-4825-af34-32903117152a';
const shapes=[[1600,900],[1200,900],[1000,1000],[900,1600]];
const rows=shapes.map(([w,h],i)=>({
 id:'123e4567-e89b-42d3-a456-42661417400'+(i+1),campaign_id:campaign,
 title:'Synthetic '+w+':'+h,asset_kind:'image',category:'location',
 storage_bucket:'campaign-materials',storage_path:campaign+'/smoke/'+(i+1)+'.svg',
 width:w,height:h
}));
const history=rows.slice().reverse().map((row,i)=>({revision:4-i,material_id:row.id}));
const auth={logged:true,gm:false};
const revoked=[],reads=[],requests=[],browserErrors=[];
window.addEventListener('unhandledrejection',e=>browserErrors.push('promise: '+String(e.reason?.stack||e.reason)));
window.addEventListener('error',e=>browserErrors.push('error: '+String(e.error?.stack||e.message)));
const originalRevoke=URL.revokeObjectURL.bind(URL);
URL.revokeObjectURL=url=>{revoked.push(url);originalRevoke(url);};
function assert(value,message){if(!value)throw Error(message);}
async function until(predicate,message){
 for(let i=0;i<160;i++){
  if(predicate())return;
  await new Promise(resolve=>setTimeout(resolve,30));
 }
 throw Error('Timeout: '+message);
}
const legolas={
 readMedia:async(row,thumb)=>{
  reads.push({id:row.id,thumb,gm:auth.gm});
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+row.width+'" height="'+row.height+'"><rect width="100%" height="100%" fill="#1d3345"/><circle cx="40%" cy="35%" r="15%" fill="#bca77c"/></svg>';
  return new Blob([svg],{type:'image/svg+xml'});
 },
 previewMaterial:()=>{},previewSequence:()=>{}
};
const request=async path=>{
 requests.push(path);
 if(path.startsWith('campaign_material_presentation_history?'))return history;
 if(path.startsWith('campaign_materials?'))return rows;
 throw Error('Unexpected route '+path);
};
const gallery=createArcaneGallery({legolas,request,getCampaign:()=>campaign,
 isLoggedIn:()=>auth.logged,isGM:()=>auth.gm});
document.querySelector('#playerTarget').append(gallery.mount());
const height=node=>parseInt(node.querySelector('.arcane-gallery-machine').style.getPropertyValue('--arcane-frame-height'),10);
const imageReady=(node,id)=>node.querySelector('#'+id)?.naturalWidth>0
  &&node.querySelector('#'+id)?.complete;
async function run(){
 gallery.sync(rows[0],1);
 await until(()=>gallery.state.selected===rows[0].id && imageReady(gallery.root,'arcaneGalleryImage')
  &&gallery.root.querySelector('.goose-player-shutter--open')
  &&gallery.root.querySelector('#arcaneGalleryEmpty').classList.contains('hidden')
  &&height(gallery.root)>0,'player ceremonial opening and first ratio');
 const playerHeights=[height(gallery.root)];
 assert(!gallery.root.classList.contains('hidden'),'player gallery hidden');
 assert(document.querySelectorAll('.arcane-gallery').length===1,'duplicate gallery component mounted');
 assert(gallery.root.querySelectorAll('.arcane-kit-wheel').length===2,'player gears missing');
 for(let i=1;i<4;i++){
  assert(gallery.step(1),'player carousel step failed at '+i);
  await until(()=>gallery.state.selected===rows[i].id
   &&gallery.root.querySelector('#arcaneGalleryImage').naturalWidth===rows[i].width
   &&height(gallery.root)>playerHeights[i-1],'player ratio '+i);
  playerHeights.push(height(gallery.root));
 }
 assert(requests.every(x=>x.includes('campaign_id=eq.'+campaign)),'unscoped history query');
 assert(requests.every(x=>x.startsWith('campaign_materials?')||x.startsWith('campaign_material_presentation_history?')),'unexpected private API');
 const privateImageUrl=gallery.state.original;
 assert(privateImageUrl.startsWith('blob:'),'player did not use private blob URL');
 auth.gm=true;gallery.sync(rows[0],5);
 await until(()=>gallery.state.role==='gm'
  &&gallery.state.selected===rows[0].id && imageReady(gallery.root,'arcaneGalleryImage')
  &&gallery.root.querySelector('.goose-player-shutter--open')
  &&height(gallery.root)>0,'GM mirrored GOOSE opening');
 assert(!gallery.root.classList.contains('hidden'),'shared gallery must remain visible to GM');
 assert(document.querySelectorAll('.arcane-gallery').length===1,'GM created a duplicate gallery');
 assert(revoked.includes(privateImageUrl),'role switch must revoke previous blob');
 assert(gallery.root.querySelectorAll('.arcane-kit-wheel').length===2,'GM shared gears missing');
 const gmHeights=[height(gallery.root)];
 for(let i=1;i<4;i++){
  assert(gallery.step(1),'GM local gallery navigation failed');
  await until(()=>gallery.state.selected===rows[i].id
    &&gallery.root.querySelector('#arcaneGalleryImage').naturalWidth===rows[i].width
    &&height(gallery.root)>gmHeights[i-1],'GM shared ratio '+i);
  gmHeights.push(height(gallery.root));
 }
 const lastGMUrl=gallery.state.original;
 assert(!requests.some(path=>path.startsWith('rpc/')),'GM viewer published from local browse');
 auth.logged=false;gallery.sync(null,6);
 assert(gallery.root.classList.contains('hidden'),'shared gallery visible after logout');
 assert(gallery.state.rows.length===0,'private rows survive logout');
 assert(revoked.includes(lastGMUrl),'GM blob not revoked on logout');
 assert(!gallery.root.querySelector('#arcaneGalleryImage').hasAttribute('src'),'shared image not cleared after logout');
 return {playerHeights,gmHeights,reads:reads.length,revoked:revoked.length,
  roles:['player','GM','signed-out'],viewers:1,assets:'public synthetic SVG only'};
}
run().then(result=>{
 document.documentElement.dataset.smoke='passed';
 window.__arcaneSmokeStatus=result;
 document.querySelector('#result').textContent='PASS '+JSON.stringify(result);
}).catch(err=>{
 document.documentElement.dataset.smoke='failed';
 window.__arcaneSmokeStatus={
  error:String(err.stack||err),
  player:{state:{campaign:gallery.state.campaign,selected:gallery.state.selected,
   rows:gallery.state.rows.map(r=>r.id),seq:gallery.state.seq,original:gallery.state.original},
   img:{complete:gallery.root.querySelector('#arcaneGalleryImage')?.complete,
    width:gallery.root.querySelector('#arcaneGalleryImage')?.naturalWidth,
    src:gallery.root.querySelector('#arcaneGalleryImage')?.getAttribute('src')?.slice(0,55)},
   frameHeight:height(gallery.root),
   status:gallery.root.querySelector('#arcaneGalleryStatus')?.textContent,
   empty:gallery.root.querySelector('#arcaneGalleryEmpty')?.textContent},
  requests:requests.slice(0,8),reads:reads.slice(0,8),browserErrors,
  auth
 };
 document.querySelector('#result').textContent='FAIL '+String(err.stack||err);
 console.error('ARCANE_AUTH_SMOKE_FAILED',err);
});
</script>
</body></html>
