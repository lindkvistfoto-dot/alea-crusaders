  </g>
  <g id="filigree" fill="none" stroke="url(#gold)" stroke-width="1.9" stroke-linejoin="round">
   <path d="M0 0C9 6 11 23 31 20C22 11 19 6 29 3C24 25 39 28 53 27C41 33 32 35 26 45"/>
   <path d="M0 0C5 17 12 23 11 48C16 40 21 39 26 45"/>
   <path d="M19 12L31 20L29 3"/>
  </g>
 </defs>
