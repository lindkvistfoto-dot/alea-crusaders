<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 560" width="256" height="560" role="img" aria-label="Sammanhängande dubbelram i guld">
 <defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#7d3d0a"/><stop offset=".15" stop-color="#ffe6a5"/><stop offset=".29" stop-color="#c46d0d"/><stop offset=".45" stop-color="#fff5be"/><stop offset=".61" stop-color="#a44f0a"/><stop offset=".77" stop-color="#f7aa36"/><stop offset="1" stop-color="#652e09"/>
  </linearGradient>
  <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#fff7d3"/><stop offset=".5" stop-color="#f99d16"/><stop offset="1" stop-color="#7e2b02"/>
  </linearGradient>
  <radialGradient id="mid" cx=".5" cy=".5" r=".7">
   <stop stop-color="#2b1c0e" stop-opacity=".93"/>
   <stop offset=".63" stop-color="#18120c" stop-opacity=".94"/>
   <stop offset="1" stop-color="#070707" stop-opacity=".97"/>
  </radialGradient>
  <filter id="glow" x="-65%" y="-65%" width="230%" height="230%">
   <feGaussianBlur stdDeviation="3.8"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
   <feTurbulence baseFrequency=".19" numOctaves="3" seed="8" type="fractalNoise" stitchTiles="stitch" result="n"/>
   <feColorMatrix in="n" type="saturate" values="0" result="grey"/>
   <feComponentTransfer in="grey"><feFuncA type="linear" slope=".14"/></feComponentTransfer>
  </filter>
  <g id="spark">
