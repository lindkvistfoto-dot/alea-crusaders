name: HERMES ALEA – archive and self-healing cleanup
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment for a manual run
        type: choice
        required: true
        default: DEV
        options: [DEV, LIVE]
permissions:
  contents: read
concurrency:
  group: hermes-alea-archive-${{ github.event_name == 'schedule' && 'scheduled' || inputs.environment }}
  cancel-in-progress: false
jobs:
  archive-live:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.environment == 'LIVE')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Archive originals and clean qualified abandoned staging jobs
        env:
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          HERMES_OAUTH_CLIENT_ID: ${{ secrets.HERMES_OAUTH_CLIENT_ID }}
          HERMES_OAUTH_CLIENT_SECRET: ${{ secrets.HERMES_OAUTH_CLIENT_SECRET }}
          HERMES_OAUTH_REFRESH_TOKEN: ${{ secrets.HERMES_OAUTH_REFRESH_TOKEN }}
          HERMES_ALEA_ARCHIVE_FOLDER_ID: ${{ vars.HERMES_ALEA_ARCHIVE_FOLDER_ID || '1vPZsU1q371IL4wr6CeDcefjENUDRlAq-' }}
          HERMES_ALEA_CLEANUP_APPROVED: 'true'
          OLYMPIA_ENVIRONMENT: LIVE
        run: python scripts/hermes_alea_worker.py --execute-cleanup --environment LIVE
  cleanup-dev:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && ((github.ref == 'refs/heads/main' && github.event_name == 'schedule') || (github.ref == 'refs/heads/development' && github.event_name == 'workflow_dispatch' && inputs.environment == 'DEV'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Clean qualified abandoned staging jobs in isolated DEV
        env:
          SUPABASE_URL: https://wkiuyklzzroavclnsxna.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.ALEA_DEVELOPMENT_SUPABASE_SECRET_KEY }}
          HERMES_ALEA_CLEANUP_APPROVED: 'true'
          OLYMPIA_ENVIRONMENT: DEV
        run: python scripts/hermes_alea_worker.py --cleanup-only --execute-cleanup --environment DEV
