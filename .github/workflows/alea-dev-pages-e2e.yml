name: ALEA DEV authenticated Pages acceptance

on:
  pull_request:
    types: [closed]
    branches: [development]

permissions:
  contents: read

jobs:
  pages-e2e:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development' && contains(github.event.pull_request.body, 'ALEA-DEV-PREVIEW:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated Playwright browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Authenticate with the permanent DEV test account
        env:
          ALEA_PR_BODY: ${{ github.event.pull_request.body || '' }}
          ALEA_DEV_TEST_EMAIL: ${{ secrets.ALEA_DEV_TEST_EMAIL }}
          ALEA_DEV_TEST_PASSWORD: ${{ secrets.ALEA_DEV_TEST_PASSWORD }}
        run: node scripts/alea-dev-pages-e2e.mjs
      - name: Upload sanitized result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alea-dev-pages-e2e-${{ github.run_id }}
          path: test-results/alea-dev-pages-e2e/
          if-no-files-found: warn
          retention-days: 7
