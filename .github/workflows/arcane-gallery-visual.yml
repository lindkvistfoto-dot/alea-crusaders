name: Arcane Gallery visual acceptance previews
on:
  push:
    branches:
      - sisyphus/arcane-gallery-shared-mechanics-20261016
    paths:
      - 'tests/fixtures/arcane-gallery-visual.html'
      - '.github/workflows/arcane-gallery-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/sisyphus/arcane-gallery-shared-mechanics-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render the actual 29-part mechanical gallery at four aspect ratios
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/arcane-vite.log 2>&1 &
          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/tests/fixtures/arcane-gallery-visual.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/arcane-vite.log; exit 1; fi
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p tests/visual-regressions
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --disable-background-networking --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=1760,1040 --virtual-time-budget=3000 \
            --screenshot=tests/visual-regressions/arcane-morph-desktop.png \
            'http://127.0.0.1:4173/tests/fixtures/arcane-gallery-visual.html'
          "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --disable-background-networking --hide-scrollbars --force-device-scale-factor=1 \
            --window-size=420,900 --virtual-time-budget=3000 \
            --screenshot=tests/visual-regressions/arcane-morph-mobile.png \
            'http://127.0.0.1:4173/tests/fixtures/arcane-gallery-visual.html'
          python - <<'PY'
          from pathlib import Path
          import struct
          for image in sorted(Path('tests/visual-regressions').glob('*.png')):
              data=image.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and len(data)>10000, image
              w,h=struct.unpack('>II',data[16:24])
              assert w>=400 and h>=800, (image,w,h)
              print('ARCANE_VISUAL_CAPTURE_OK',image,w,h,len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-morph-preview
          path: tests/visual-regressions/arcane-morph-*.png
          if-no-files-found: error
      - name: Keep sanitized screenshots on preview branch for design review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual-regressions/arcane-morph-desktop.png tests/visual-regressions/arcane-morph-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "test(gallery): capture four-ratio desktop and mobile frame previews"
            git push origin HEAD:sisyphus/arcane-gallery-shared-mechanics-20261016
          fi
