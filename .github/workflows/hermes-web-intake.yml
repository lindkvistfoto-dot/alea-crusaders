name: HERMES 4.1 – Web intake delivery
# Pilot: first real Standard-pose delivery. Never enable a recurring schedule before OAuth production approval.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hermes-web-intake.yml'
      - 'scripts/hermes_web_worker.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-web-intake-worker
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Compile HERMES worker
        run: python -m py_compile scripts/hermes_web_worker.py
      - name: Require dedicated writer configuration
        env:
          OAUTH_CLIENT: ${{ secrets.HERMES_OAUTH_CLIENT_ID }}
          ARCHIVE: ${{ vars.HERMES_WEB_ARCHIVE_FOLDER_ID }}
          SERVICE: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$OAUTH_CLIENT" || { echo "::error::HERMES OAuth client missing"; exit 1; }
          test -n "$ARCHIVE" || { echo "::error::Archive folder missing"; exit 1; }
          test -n "$SERVICE" || { echo "::error::Supabase server secret missing"; exit 1; }
      - name: Deliver queued originals through HERMES
        env:
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          HERMES_OAUTH_CLIENT_ID: ${{ secrets.HERMES_OAUTH_CLIENT_ID }}
          HERMES_OAUTH_CLIENT_SECRET: ${{ secrets.HERMES_OAUTH_CLIENT_SECRET }}
          HERMES_OAUTH_REFRESH_TOKEN: ${{ secrets.HERMES_OAUTH_REFRESH_TOKEN }}
          HERMES_WEB_ARCHIVE_FOLDER_ID: ${{ vars.HERMES_WEB_ARCHIVE_FOLDER_ID }}
        run: python scripts/hermes_web_worker.py
