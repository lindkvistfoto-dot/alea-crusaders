name: Kartverkstad visual regression
on:
  pull_request:
    paths:
      - 'features/map/kartakademin*'
      - 'features/map/polygon-*.js'
      - 'scripts/polygon-studio-visual.mjs'
      - 'scripts/kartverkstad*visual.mjs'
      - 'scripts/kartakademin-surface-visual.mjs'
      - '.github/workflows/kartverkstad-visual.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the project's browser test driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Capture previous and current layouts in Chrome
        run: |
          set -euo pipefail
          previous=$(git log -1 --format=%H -- features/map/kartakademin.css)^
          if git cat-file -e "$previous:features/map/kartakademin.js"; then
            git worktree add --detach "$RUNNER_TEMP/kart-before" "$previous"
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/kart-before/node_modules"
            (cd "$RUNNER_TEMP/kart-before" && npm run build)
            python -m http.server 4180 --bind 127.0.0.1 --directory "$RUNNER_TEMP/kart-before/dist" > "$RUNNER_TEMP/kart-before-http.log" 2>&1 &
            node scripts/kartverkstad-visual.mjs http://127.0.0.1:4180 visual-results/before baseline
            node scripts/kartverkstad-shadow-visual.mjs http://127.0.0.1:4180 "$RUNNER_TEMP/kart-before/dist" visual-results/before/shadows baseline
          fi
          npm run build
          python -m http.server 4181 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/kart-http.log" 2>&1 &
          node scripts/kartverkstad-visual.mjs http://127.0.0.1:4181 visual-results/after
          node scripts/polygon-studio-visual.mjs http://127.0.0.1:4181 visual-results/after/polygons
          node scripts/kartverkstad-shadow-visual.mjs http://127.0.0.1:4181 dist visual-results/after/shadows
      - name: Read the approved painted crypt fixture
        uses: actions/checkout@v4
        with:
          ref: 50e116696aa47a8f4179874638a149e4cc510fd0
          path: crypt-fixture
          sparse-checkout: preview/art-first
          persist-credentials: false
      - name: Exercise wall receivers in the ordinary GM editor
        run: node scripts/kartakademin-surface-visual.mjs http://127.0.0.1:4181 crypt-fixture/preview/art-first/warm-floor.webp visual-results/after/walls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kartverkstad-desktop-mobile
          path: visual-results/
          retention-days: 14
