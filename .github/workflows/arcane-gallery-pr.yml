name: Arcane Gallery PR verification
on:
  pull_request:
    paths:
      - 'features/material/arcane-gallery*'
      - 'features/material/arcane-morph*'
      - 'features/material/goose-player-shutter*'
      - 'tests/goose-player-shutter.test.js'
      - 'tests/test_hermes_goose_pipeline.py'
      - 'scripts/hermes_drive_intake.py'
      - 'scripts/hermes_ui_prepare.py'
      - 'scripts/publish_hermes_ui.mjs'
      - '.github/workflows/hermes-ui-intake.yml'
      - 'features/material/frodo-ui.js'
      - 'features/material/library.js'
      - 'index.html'
      - 'tests/arcane-gallery*.test.js'
      - 'tests/arcane-morph*.test.js'
      - 'tests/fixtures/arcane-gallery-role-smoke.html'
      - 'scripts/arcane_gallery_role_smoke.cjs'
      - 'tests/material-atelier-mobile.test.js'
      - 'tests/material-polish.test.js'
      - '.github/workflows/arcane-gallery-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify HERMES GOOSE fixed-geometry alpha pipeline
        run: |
          python -m pip install Pillow==12.3.0
          python -m unittest discover -s tests -p test_hermes_goose_pipeline.py -v
      - name: Gallery and integration regression tests
        run: npx vitest run tests/arcane-gallery.test.js tests/goose-player-shutter.test.js tests/arcane-gallery-aspect.test.js tests/arcane-morph-markup.test.js tests/arcane-morph-art-assets.test.js tests/arcane-gallery-release-smoke.test.js tests/arcane-gm-preview.test.js tests/material-legolas-viewer.test.js tests/material-atelier-mobile.test.js tests/material-polish.test.js tests/material-frodo-presentation.test.js
      - name: Browser role-switch and four-ratio smoke (synthetic roles, no private data)
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/alea-gallery-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/tests/fixtures/arcane-gallery-role-smoke.html >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/alea-gallery-vite.log; exit 1; fi
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/arcane_gallery_role_smoke.cjs
      - name: Production build
        run: npm run build
