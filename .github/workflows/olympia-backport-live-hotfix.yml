name: OLYMPIA · return LIVE hotfixes to DEV

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: olympia-hotfix-backport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.event.pull_request.merged == true && !startsWith(github.event.pull_request.head.ref, 'olympia/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out DEV
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare exact backport patch on current DEV
        id: backport
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          HOTFIX_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$MERGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Merged LIVE PR metadata is incomplete."; exit 1; }
          [[ "$HOTFIX_BRANCH" != olympia/* ]] || { echo "::error::OLYMPIA release commits are already represented by their source DEV PR and must not be cherry-picked."; exit 1; }
          git fetch origin main --no-tags
          git cat-file -e "$MERGE_SHA^{commit}"
          PATCH_BASE="$(git rev-parse "$MERGE_SHA^1")"
          PATCH_FILE="$RUNNER_TEMP/live-hotfix-$PR_NUMBER.patch"
          git diff --binary --full-index "$PATCH_BASE" "$MERGE_SHA" > "$PATCH_FILE"
          [[ -s "$PATCH_FILE" ]] || { echo "::error::The merged LIVE hotfix has no patch to return."; exit 1; }
          DEV_BASE="$(git rev-parse origin/development)"
          BRANCH="reconcile/live-hotfix/pr-$PR_NUMBER-${MERGE_SHA:0:8}-dev-${DEV_BASE:0:8}"
          git switch --create "$BRANCH" "$DEV_BASE"
          if ! git apply --3way --index "$PATCH_FILE"; then
            echo "::error::LIVE hotfix PR #$PR_NUMBER overlaps current DEV files. No partial backport branch or PR was published."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "already_present=true" >> "$GITHUB_OUTPUT"
            echo "dev_base=$DEV_BASE" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm ci --no-audit --no-fund
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE_COMMIT_DATE="$(git show -s --format=%cI "$MERGE_SHA")"
          GIT_AUTHOR_DATE="$SOURCE_COMMIT_DATE" GIT_COMMITTER_DATE="$SOURCE_COMMIT_DATE" git commit -m "reconcile(live-hotfix): backport PR #$PR_NUMBER"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "dev_base=$DEV_BASE" >> "$GITHUB_OUTPUT"
          echo "already_present=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app-token
        if: steps.backport.outputs.already_present != 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OLYMPIA_RELEASE_APP_ID }}
          private-key: ${{ secrets.OLYMPIA_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: alea-crusaders
          permission-contents: write
          permission-pull-requests: write

      - name: Push backport branch and open DEV PR
        if: steps.backport.outputs.already_present != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BRANCH: ${{ steps.backport.outputs.branch }}
          DEV_BASE: ${{ steps.backport.outputs.dev_base }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$AUTH" push origin "HEAD:refs/heads/$BRANCH"
          BODY="$(cat <<EOF
          ## LIVE hotfix backport

          - Source LIVE PR: #$PR_NUMBER
          - Source merge SHA: $MERGE_SHA
          - DEV base SHA: $DEV_BASE
          - Applied as an exact patch to current development.
          - npm run check passed before this PR was opened.
          - No automatic DEV merge; CI and the normal DEV approval path remain required.
          EOF
          )"
          EXISTING_PR="$(gh api "repos/$REPOSITORY/pulls?state=open&head=$REPOSITORY:$BRANCH&base=development" --jq '.[0].html_url // empty')"
          if [[ -z "$EXISTING_PR" ]]; then
            gh api "repos/$REPOSITORY/pulls" -X POST -f title="reconcile(live-hotfix): backport PR #$PR_NUMBER to DEV" -f head="$BRANCH" -f base=development -f body="$BODY"
          else
            echo "Backport PR already exists: $EXISTING_PR"
          fi

      - name: Record reconciliation result in Issue 884
        if: success()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DEV_BASE: ${{ steps.backport.outputs.dev_base }}
          BACKPORT_BRANCH: ${{ steps.backport.outputs.branch }}
          ALREADY_PRESENT: ${{ steps.backport.outputs.already_present }}
        with:
          script: |
            const result = process.env.ALREADY_PRESENT === "true"
              ? "The same patch is already present in DEV; no backport PR was needed."
              : "A verified backport PR was opened from " + process.env.BACKPORT_BRANCH + ". It remains subject to normal DEV CI and approval.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 884,
              body: [
                "## LIVE hotfix reconciliation",
                "",
                "- Source LIVE PR: #" + process.env.PR_NUMBER,
                "- LIVE merge SHA: " + process.env.MERGE_SHA,
                "- DEV base SHA: " + process.env.DEV_BASE,
                "- Result: " + result,
                "- Workflow: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
              ].join("\n")
            });

      - name: Record blocked reconciliation in Issue 884
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 884,
              body: [
                "## LIVE hotfix reconciliation blocked",
                "",
                "- Source LIVE PR: #" + context.issue.number,
                "- No backport was merged or partially published.",
                "- Resolve the conflict or workflow error shown in this run, then resume from the exact LIVE merge SHA.",
                "- Workflow: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId
              ].join("\n")
            });
