name: HERMES 3 – isolated staging checks

on:
  pull_request:
    paths:
      - 'hermes3/**'
      - 'config/hermes3-profiles.json'
      - 'scripts/hermes3_*'
      - 'tests/hermes3-*'
      - 'tests/test_hermes3_*'
      - '.github/workflows/hermes3-*'
      - 'docs/HERMES3.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    name: Validate public-media contract and build without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check queued staging metadata (no Google access)
        run: node scripts/hermes3_policy.mjs --all
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Setup Python 3.12 for offline media verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Python intake verifier syntax
        run: python3 -m py_compile scripts/hermes3_drive_verify.py scripts/hermes3_stage.py scripts/hermes3_review.py
      - name: Offline HERMES media and ZIP safety tests
        run: python3 -m unittest discover -s tests -p 'test_hermes3_*.py' -v
      - name: Security and protocol regression tests
        run: npx vitest run tests/hermes3-policy.test.js
      - name: Verify and convert the 29 authentic Arcane sprites (offline fixture)
        run: python3 -m scripts.hermes3_archive_smoke "$RUNNER_TEMP/hermes3-arcane-preview"
      - name: Generate image contact sheet and blocked release candidate
        run: python3 -m scripts.hermes3_review "$RUNNER_TEMP/hermes3-arcane-preview" "$RUNNER_TEMP/hermes3-arcane-review"
      - name: Archive 29 review sprites without publication
        uses: actions/upload-artifact@v4
        with:
          name: hermes3-arcane-sprite-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hermes3-arcane-preview/
            ${{ runner.temp }}/hermes3-arcane-review/
          retention-days: 7
          if-no-files-found: error
      - name: Create staging build without deployment
        run: npm run build
      - name: Upload staging build as non-deployed review artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes3-staging-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
