name: MINOTAURUS – prevent original regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            features/combat
            features/material
            features/ui
            supabase
            config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject original trees and new PNG blobs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/minotaurus_guard.py "$BASE" "$HEAD"
      - run: python -m pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_minotaurus*.py'
      - run: python -m unittest discover -s tests -p 'test_hermes4*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/minotaurus-publisher.test.mjs tests/hermes4-batch-publisher.test.mjs tests/hermes-system-assets-publisher.test.mjs tests/arcane-paper-doll-assets.test.js tests/arcane-system-assets-rls.test.mjs tests/hermes-wide-publisher.test.mjs tests/hermes-spell-cutout-profile.test.js tests/hermes-v2-gates.test.mjs tests/arcane-gallery-release-smoke.test.js tests/arcane-morph-art-assets.test.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --node-modules-dir=auto scripts/hermes2_publish.ts supabase/functions/hermes-v2/index.ts
