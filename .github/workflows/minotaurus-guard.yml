name: MINOTAURUS – prevent original regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: minotaurus-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            features/combat
            features/material
            features/ui
            features/hermes-core
            features/trophy-room
            features/honors
            src/honors
            hermes
            supabase
            config
            .github/workflows
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select relevant test groups
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ! python scripts/minotaurus_select.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"; then
            echo "Selector failed; selecting the complete MINOTAURUS suite."
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
      # Mandatory asset-provenance check; selection never gates this step.
      - name: Reject original trees and new PNG blobs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/minotaurus_guard.py "$BASE" "$HEAD"
      - name: Test MINOTAURUS selector
        run: python -m unittest discover -s tests -p 'test_minotaurus_select.py' -v
      - name: Install pinned image verifier
        if: steps.select.outputs.hermes4_python == 'true' || steps.select.outputs.full == 'true'
        run: python -m pip install Pillow==12.3.0
      - name: Run legacy image-pipeline Python tests
        if: steps.select.outputs.hermes4_python == 'true' || steps.select.outputs.full == 'true'
        run: |
          python -m unittest discover -s tests -p 'test_minotaurus*.py' -v
          python -m unittest discover -s tests -p 'test_hermes4*.py' -v
      - name: Run HERMES 4.1 worker tests
        if: steps.select.outputs.web_worker_python == 'true' || steps.select.outputs.full == 'true'
        run: python -m unittest discover -s tests -p 'test_hermes_web_worker.py' -v
      - uses: actions/setup-node@v4
        if: steps.select.outputs.vitest_files != '' || steps.select.outputs.full == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Install Node dependencies
        if: steps.select.outputs.vitest_files != '' || steps.select.outputs.full == 'true'
        run: npm ci --no-audit --no-fund
      - name: Run selected Vitest suites
        if: steps.select.outputs.vitest_files != '' || steps.select.outputs.full == 'true'
        env:
          VITEST_FILES: ${{ steps.select.outputs.vitest_files }}
          FULL: ${{ steps.select.outputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            npx vitest run \
              tests/minotaurus-publisher.test.mjs \
              tests/hermes4-batch-publisher.test.mjs \
              tests/hermes-system-assets-publisher.test.mjs \
              tests/arcane-paper-doll-assets.test.js \
              tests/arcane-system-assets-rls.test.mjs \
              tests/hermes-wide-publisher.test.js \
              tests/hermes-spell-cutout-profile.test.js \
              tests/hermes-v2-gates.test.mjs \
              tests/arcane-gallery-release-smoke.test.js \
              tests/arcane-morph-art-assets.test.js
          elif [ -n "$VITEST_FILES" ]; then
            npx vitest run $VITEST_FILES
          fi
      - uses: denoland/setup-deno@v2
        if: steps.select.outputs.deno_hermes2 == 'true' || steps.select.outputs.deno_hermes_v2 == 'true' || steps.select.outputs.full == 'true'
        with:
          deno-version: v2.x
      - name: Typecheck legacy HERMES publisher
        if: steps.select.outputs.deno_hermes2 == 'true' || steps.select.outputs.full == 'true'
        run: deno check --node-modules-dir=auto scripts/hermes2_publish.ts
      - name: Typecheck HERMES v2 Edge Function
        if: steps.select.outputs.deno_hermes_v2 == 'true' || steps.select.outputs.full == 'true'
        run: deno check --node-modules-dir=auto supabase/functions/hermes-v2/index.ts
