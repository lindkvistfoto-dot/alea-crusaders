name: MINOTAURUS – requested PR check
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true
        type: string
      level:
        description: 'Requested check level (does not replace required checks)'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
permissions:
  contents: read
  pull-requests: read
jobs:
  requested:
    name: MINOTAURUS ${{ inputs.level }} – PR ${{ inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid PR number"
            exit 1
          fi
      - name: Checkout requested PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Level 1 – build and OLYMPIA UI regression
        if: inputs.level == '1'
        run: |
          npm run build
          npx vitest run tests/olympia-zeus-control.test.mjs
      - name: Level 2 – application tests and build
        if: inputs.level == '2'
        run: npm run check
      - name: Level 3 – full application check
        if: inputs.level == '3'
        run: npm run check
      - name: Level 3 – MINOTAURUS Python and HERMES checks
        if: inputs.level == '3'
        run: |
          python -m pip install Pillow==12.3.0
          python -m unittest discover -s tests -p 'test_minotaurus*.py'
          python -m unittest discover -s tests -p 'test_hermes4*.py'
          npx vitest run tests/minotaurus-publisher.test.mjs tests/hermes4-batch-publisher.test.mjs tests/hermes-system-assets-publisher.test.mjs
      - name: Explain scope
        run: |
          echo 'This is an optional, manually requested diagnostic.'
          echo 'Required CI, MINOTAURUS guard and ARCANE Preview remain unchanged.'
