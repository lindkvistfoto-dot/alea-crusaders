name: HERMES ALEA offline acceptance
on:
  pull_request:
    paths:
      - 'features/hermes-alea/**'
      - 'features/honors/**'
      - 'features/trophy-room/**'
      - 'supabase/**'
      - 'scripts/hermes*'
      - 'tests/*hermes*'
      - '.github/workflows/hermes-alea*.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/hermes-alea-core.test.mjs tests/hermes-alea-validation.test.mjs tests/hermes-alea-client.test.mjs tests/hermes-alea-profiles.test.mjs features/honors src/honors tests/arcane-trophy-room.test.mjs --maxWorkers=1
      - name: Package approved ImageMagick-WASM verifier
        run: node scripts/hermes-alea-prepare-edge.mjs
      - name: Verify bundled verifier binary
        run: python3 -c "from pathlib import Path; p=Path('supabase/functions/hermes-alea/magick.wasm'); assert p.is_file() and p.stat().st_size > 100000, 'Missing verifier WASM'"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check HERMES ALEA Edge entrypoint
        run: deno check --config supabase/functions/hermes-alea/deno.json supabase/functions/hermes-alea/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m unittest discover -s tests -p 'test_hermes_alea_worker.py' -v
      - run: python -m unittest discover -s tests -p 'test_hermes_web_worker.py' -v
