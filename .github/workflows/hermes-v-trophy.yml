name: HERMES V – Bildpublicering (PHOENIX)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Image category (existing HERMES kinds)'
        required: true
        type: choice
        options: [system-asset, spell, spell-cutout, symbol, skill, skill-illustration, skill-illustration-wide, spell-illustration, spell-illustration-wide]
      target_key:
        description: 'Destination key in Alea'
        required: true
        type: string
      target_id:
        description: 'Existing target UUID (or approved system asset UUID)'
        required: true
        type: string
      inbox_id:
        description: 'Google Drive Inbox original file ID'
        required: true
        type: string
      archive_id:
        description: 'Independent verified original archive file ID'
        required: true
        type: string
      sha256:
        description: 'SHA-256 of original PNG'
        required: true
        type: string
      approved:
        description: 'I confirm the image was visually approved'
        required: true
        type: boolean
      honor_id:
        description: 'Optional badge/award UUID to attach the published image'
        required: false
        type: string
      honor_material:
        description: 'Relief material when honor_id is provided'
        required: false
        type: choice
        options: ['', enamel, metal, wood]
      mode:
        description: 'verify checks source; publish activates after all integrity checks'
        required: true
        type: choice
        default: verify
        options: [verify, publish]

permissions:
  contents: read
  id-token: write

concurrency:
  group: hermes-v-${{ inputs.kind }}-${{ inputs.target_key }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==12.3.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck existing publisher
        run: deno check --no-config --no-lock --node-modules-dir=none scripts/hermes2_publish.ts
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303776456341/locations/global/workloadIdentityPools/github/providers/alea-hermes
          service_account: hermes-transfer@alea-hermes.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Verify and publish one approved image
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          HERMES_V_KIND: ${{ inputs.kind }}
          HERMES_V_KEY: ${{ inputs.target_key }}
          HERMES_V_TARGET_ID: ${{ inputs.target_id }}
          HERMES_V_INBOX_ID: ${{ inputs.inbox_id }}
          HERMES_V_ARCHIVE_ID: ${{ inputs.archive_id }}
          HERMES_V_SHA256: ${{ inputs.sha256 }}
          HERMES_V_APPROVED: ${{ inputs.approved }}
          HERMES_V_MODE: ${{ inputs.mode }}
          HERMES_V_HONOR_ID: ${{ inputs.honor_id }}
          HERMES_V_HONOR_MATERIAL: ${{ inputs.honor_material }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/hermes-v"
          mkdir -p "$output"
          mkdir -p hermes/queue
          if [ "$HERMES_V_APPROVED" != "true" ]; then echo "::error::Visual approval required"; exit 1; fi
          python scripts/hermes_v_trophy.py --kind "$HERMES_V_KIND" --target-key "$HERMES_V_KEY" --target-id "$HERMES_V_TARGET_ID" --inbox-id "$HERMES_V_INBOX_ID" --archive-id "$HERMES_V_ARCHIVE_ID" --sha256 "$HERMES_V_SHA256" --approved --mode "$HERMES_V_MODE" --output "hermes/queue/phoenix-image-request.json"
          python scripts/hermes_drive_intake.py "hermes/queue/phoenix-image-request.json" --output "$output/result"
          if [ -f "$output/result/manifest.json" ]; then
            if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "::error::HERMES V cannot publish: service credential missing"; exit 1
            fi
            HERMES_REPORT_PATH="$output/result/publisher-report.json" deno run --no-config --no-lock --allow-env --allow-net --allow-read="$output/result" --allow-write="$output/result" --node-modules-dir=none scripts/hermes2_publish.ts "$output/result/manifest.json" "$output/result"
          fi
          python scripts/hermes_drive_intake.py --finalize --output "$output/result"
          if [ "$HERMES_V_MODE" = "publish" ] && [ -n "$HERMES_V_HONOR_ID" ]; then
            if [ "$HERMES_V_KIND" != "system-asset" ] || [ -z "$HERMES_V_HONOR_MATERIAL" ]; then echo "::error::Honor variant requires system-asset and material"; exit 1; fi
            deno run --no-config --no-lock --allow-env --allow-net --node-modules-dir=none scripts/hermes_v_link_honor.ts "$HERMES_V_HONOR_ID" "$HERMES_V_HONOR_MATERIAL" "$HERMES_V_KEY"
          fi
      - name: Preserve auditable result and retry instructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-v-${{ inputs.kind }}-${{ inputs.mode }}
          path: ${{ runner.temp }}/hermes-v/**/*.json
          if-no-files-found: ignore
          retention-days: 30
