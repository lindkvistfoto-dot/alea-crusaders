name: HERMES V – PHOENIX publication retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired PHOENIX publication
        run: |
          echo "::error::PHOENIX / HERMES V publication is retired. Use HERMES CORE for developer Drive deliveries. Create honor definitions and relief variants through ALEA before publishing their images; selection, activation and grants remain in ALEA. Historical images, originals, jobs, aliases and rollback scripts are preserved."
          exit 1
