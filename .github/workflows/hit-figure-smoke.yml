name: Hit figure smoke
on:
  push:
    branches: [main]
    paths:
      - 'features/combat/hit-figures.js'
      - 'features/combat/hit-figures.css'
      - 'features/combat/runtime.js'
      - 'features/combat/spell-chooser.css'
      - 'features/combat/attack-participants.css'
      - 'features/combat/desktop-tight.css'
      - 'features/combat/equipment-background.css'
      - 'features/combat/weapon-detail-crop.css'
      - 'features/combat/equipment-crop-quadrants.css'
      - 'tests/combat-equipment-crop-quadrants.test.js'
      - 'supabase/migrations/20261012233500_combat_equipment_crop_quadrant.sql'
      - 'tests/combat-weapon-detail-crop.test.js'
      - 'assets/combat/round-equipment-leather.webp'
      - 'tests/combat-equipment-background.test.js'
      - 'tests/combat-desktop-dashboard.test.js'
      - 'tests/combat-attack-participant-cards.test.js'
      - 'tests/combat-spell-chooser-layout.test.js'
      - 'src/main.js'
      - 'legacy/app.js'
      - 'features/combat/special-images.css'
      - 'tests/special-images-admin.test.js'
      - 'tests/combat-round-background-gallery.test.js'
      - 'tests/combat-hit-figure-packs.test.js'
      - 'index.html'
      - '.github/workflows/hit-figure-smoke.yml'
  workflow_dispatch:
jobs:
  hit-figure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/combat-equipment-crop-quadrants.test.js tests/combat-weapon-detail-crop.test.js tests/combat-equipment-background.test.js tests/combat-desktop-dashboard.test.js tests/combat-attack-participant-cards.test.js tests/combat-hit-figure-packs.test.js tests/combat-round-background-gallery.test.js tests/special-images-admin.test.js tests/combat-spell-chooser-layout.test.js tests/combat-magic-contrast.test.js tests/combat-manual-magic.test.js tests/item-granted-spells.test.js
      - run: npm run build
