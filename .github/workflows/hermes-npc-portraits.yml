name: HERMES – legacy private NPC publisher retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired private NPC publication
        run: |
          echo "::error::Legacy private NPC portrait publication is retired. Use HERMES CORE profile npc-portrait-private for developer Drive deliveries to existing global NPCs. ALEA uploads, NPC/campaign registers, private image access, originals, history and rollback scripts are preserved."
          exit 1
