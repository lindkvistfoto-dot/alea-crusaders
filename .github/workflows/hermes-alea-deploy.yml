name: HERMES ALEA – deploy verifier
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN in repository Actions secrets before deployment"
            exit 1
          fi
      - run: npm ci
      - name: Package approved local WASM
        run: node scripts/hermes-alea-prepare-edge.mjs
      - name: Validate packaged binary
        run: python3 -c "from pathlib import Path; p=Path('supabase/functions/hermes-alea/magick.wasm'); assert p.is_file() and p.stat().st_size > 100000"
      - name: Deploy isolated Edge Function (does not enable uploads)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.81.3 functions deploy hermes-alea --project-ref wbmosmkirsitkonejzpg
