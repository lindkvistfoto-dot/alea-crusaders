name: HERMES ALEA – deploy verifier
on:
  push:
    branches: [hermes/alea-battle-pose-integration]
    paths:
      - 'supabase/functions/hermes-alea/**'
      - 'scripts/hermes-alea-prepare-edge.mjs'
      - 'package-lock.json'
      - '.github/workflows/hermes-alea-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/hermes/alea-battle-pose-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact PR checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/hermes/alea-battle-pose-integration" ]]
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$GITHUB_SHA" ]]
          echo "PR source SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Check deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN in repository Actions secrets before deployment"
            exit 1
          fi
      - run: npm ci
      - name: Verify Docker local bundler
        run: |
          docker info --format 'Docker server: {{.ServerVersion}}'
      - name: Package approved local WASM
        run: node scripts/hermes-alea-prepare-edge.mjs
      - name: Validate packaged binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('supabase/functions/hermes-alea/magick.wasm')
          assert p.is_file() and p.read_bytes()[:4] == b'\x00asm'
          size=p.stat().st_size
          print(f'magick.wasm: {size} bytes')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(f'WASM size: {size} bytes\\n')
          PY
      - name: Deploy isolated Edge Function (does not enable uploads)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          npx --yes supabase@2.81.3 functions deploy hermes-alea --project-ref wkiuyklzzroavclnsxna --debug 2>&1 | tee hermes-alea-deploy-debug.log
          grep -Ei 'script size|bundle size|function size|bundling' hermes-alea-deploy-debug.log | tail -n 20 || true
      - name: Recover abandoned DEV staging with the existing project credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const ref='wkiuyklzzroavclnsxna';
          const owner='66e4fd1b-ccd1-49a5-bbed-2b7264981732';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw Error('SUPABASE_ACCESS_TOKEN unavailable');
          const keysResponse=await fetch('https://api.supabase.com/v1/projects/'+ref+'/api-keys?reveal=true',{headers:{Authorization:'Bearer '+token}});
          if(!keysResponse.ok)throw Error('Existing token cannot read the DEV service key (HTTP '+keysResponse.status+'); no cleanup was run.');
          const keys=await keysResponse.json();
          const service=keys.find(item=>item.name==='service_role')?.api_key;
          if(!service)throw Error('DEV service_role key was not returned; no cleanup was run.');
          console.log('::add-mask::'+service);
          const response=await fetch('https://'+ref+'.supabase.co/functions/v1/hermes-alea',{
            method:'POST',
            headers:{apikey:service,Authorization:'Bearer '+service,'Content-Type':'application/json'},
            body:JSON.stringify({action:'recover_staging',requested_by:owner})
          });
          const result=await response.json().catch(()=>null);
          if(!response.ok)throw Error('DEV staging recovery failed (HTTP '+response.status+'): '+(result?.error||'unknown error'));
          console.log('DEV staging recovered: '+result.recovered+' jobs; reservation released: '+result.released_bytes+' bytes');
          if(!result.recovered)throw Error('No abandoned DEV job was recovered; quota remains unchanged.');
          NODE
