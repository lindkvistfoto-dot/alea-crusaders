name: ARCANE IVORY image pipeline
on:
  push:
    branches: [main]
    paths:
      - 'features/combat/spell-art.js'
      - 'features/combat/runtime.js'
      - 'vite.config.js'
      - 'assets/spells/arcane-ivory/*.webp'
      - 'assets/spells/arcane-ivory/manifest.json'
      - 'tests/spell-master-art.test.js'
      - 'scripts/hermes-verify.mjs'
      - 'config/hermes-profiles.json'
      - 'docs/HERMES.md'
      - '.github/workflows/arcane-ivory-image-smoke.yml'
  workflow_dispatch:
jobs:
  image-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/spell-master-art.test.js
      - name: Validate HERMES image contract
        run: node scripts/hermes-verify.mjs
      - run: npm run build
      - name: Verify app ships optimized WebP, not the full master PNG
        run: |
          node --input-type=module -e '
          import {readFileSync,existsSync} from "node:fs";
          import {strict as assert} from "node:assert";
          const directory="dist/assets/spells/arcane-ivory/";
          const manifest=JSON.parse(readFileSync(directory+"manifest.json","utf8"));
          assert(manifest.icons.length>0);
          for(const icon of manifest.icons){
            const data=readFileSync(directory+icon.app);
            assert(data.subarray(0,4).toString()==="RIFF","not a WebP RIFF");
            assert(data.subarray(8,12).toString()==="WEBP","not a WebP");
            assert(data.length<=500000,"app asset too large");
            assert(!existsSync(directory+icon.source),"original PNG must not ship in dist");
            console.log(icon.spell_key, data.length, "bytes");
          }
          '
