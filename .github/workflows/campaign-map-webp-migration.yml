name: Campaign maps PNG to WebP

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Prepare files, or apply after the Skelettbyn original is archived in Drive
        required: true
        type: choice
        options:
          - prepare
          - apply
      archive_drive_file_id:
        description: Required for apply; Drive ID of Skelettbyn-original.png in the configured maps archive folder
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: campaign-map-webp-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          sparse-checkout: |
            scripts/campaign_map_webp_migration.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned WebP converter
        run: python -m pip install Pillow==12.3.0
      - id: google
        if: inputs.phase == 'apply'
        name: Authenticate with read-only access to verify the Drive archive
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303776456341/locations/global/workloadIdentityPools/github/providers/alea-hermes
          service_account: hermes-transfer@alea-hermes.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Prepare or apply the scoped map migration
        env:
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          MAP_MIGRATION_MODE: ${{ inputs.phase }}
          ARCHIVE_DRIVE_FILE_ID: ${{ inputs.archive_drive_file_id }}
          MAP_OUTPUT_DIR: ${{ runner.temp }}/campaign-map-migration
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing HERMES_SUPABASE_SERVICE_ROLE_KEY"; exit 1
          fi
          python scripts/campaign_map_webp_migration.py
      - name: Upload migration files and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-map-webp-${{ inputs.phase }}
          path: ${{ runner.temp }}/campaign-map-migration/
          if-no-files-found: warn
          retention-days: 14
