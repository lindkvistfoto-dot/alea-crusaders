name: HERMES 4.1 small regression tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hermes41-small-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes41-recovery-tests
          sparse-checkout: |
            scripts/hermes_web_worker.py
            tests/test_hermes_web_worker.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Compile worker and tests
        run: python -m py_compile scripts/hermes_web_worker.py tests/test_hermes_web_worker.py
      - name: Test SHA256
        run: python -m unittest discover -s tests -p test_hermes_web_worker.py -k digest -v
      - name: Test OAuth failure isolation
        run: python -m unittest discover -s tests -p test_hermes_web_worker.py -k oauth -v
      - name: Test Drive archive handling
        run: python -m unittest discover -s tests -p test_hermes_web_worker.py -k archive -v
      - name: Test recovery
        run: python -m unittest discover -s tests -p test_hermes_web_worker.py -k recover -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -p test_hermes_web_worker.py -v
