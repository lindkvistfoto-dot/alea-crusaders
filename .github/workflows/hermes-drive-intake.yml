name: HERMES – legacy Drive intake retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject retired HERMES 2.x Drive publication
        run: |
          echo "::error::Legacy HERMES Drive batch publication is retired. Use the HERMES CORE Drive queue for developer image deliveries. Historical requests, jobs, scripts, and rollback records are preserved."
          exit 1
