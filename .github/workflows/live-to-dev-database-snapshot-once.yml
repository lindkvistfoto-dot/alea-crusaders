name: One-time live to development database snapshot

on:
  push:
    branches:
      - codex/dev-database-snapshot-once

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor == 'lindkvistfoto-dot' && github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/codex/dev-database-snapshot-once'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate live and development connection strings
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ secrets.ALEA_PRODUCTION_DATABASE_URL }}
          DEVELOPMENT_DATABASE_URL: ${{ secrets.ALEA_DEVELOPMENT_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_DATABASE_URL" || -z "$DEVELOPMENT_DATABASE_URL" ]]; then
            echo "::error::A required database connection secret is missing."
            exit 1
          fi
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import unquote, urlparse

          for name, raw, ref in [
              ("live", os.environ["SOURCE_DATABASE_URL"], "wbmosmkirsitkonejzpg"),
              ("development", os.environ["DEVELOPMENT_DATABASE_URL"], "wkiuyklzzroavclnsxna"),
          ]:
              url = urlparse(raw)
              username = unquote(url.username or "")
              direct = url.hostname == f"db.{ref}.supabase.co"
              pooler = (
                  url.hostname is not None
                  and url.hostname.endswith(".pooler.supabase.com")
                  and username == f"postgres.{ref}"
              )
              if url.scheme not in {"postgres", "postgresql"} or not (direct or pooler):
                  print(f"::error::{name} connection does not match the expected Supabase project.")
                  sys.exit(1)
          print("Both database endpoints match their expected projects.")
          PY

      - name: Verify development target is empty
        shell: bash
        env:
          DEVELOPMENT_DATABASE_URL: ${{ secrets.ALEA_DEVELOPMENT_DATABASE_URL }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/target-preflight.sql" <<'SQL'
          SELECT (current_setting('server_version_num')::int / 10000)::text
            || ':' || (SELECT count(*)::text FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                       WHERE n.nspname IN ('public','private') AND c.relkind IN ('r','p','v','m','f'))
            || ':' || (SELECT count(*)::text FROM auth.users)
            || ':' || (SELECT count(*)::text FROM auth.identities);
          SQL
          docker run --rm \
            -e DEVELOPMENT_DATABASE_URL \
            -v "$RUNNER_TEMP:/snapshot" \
            postgres:17 bash -euc 'psql "$DEVELOPMENT_DATABASE_URL" -X -v ON_ERROR_STOP=1 -qAt -f /snapshot/target-preflight.sql' \
            > "$RUNNER_TEMP/target-state"
          target_state="$(cat "$RUNNER_TEMP/target-state")"
          if [[ "$target_state" != "17:0:0:0" ]]; then
            echo "::error::Development must be PostgreSQL 17 with empty public/private schemas and no auth users. No import was attempted."
            exit 1
          fi
          echo "Development target is empty and ready; no changes made." >> "$GITHUB_STEP_SUMMARY"

      - name: Dump and atomically import the live snapshot
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ secrets.ALEA_PRODUCTION_DATABASE_URL }}
          DEVELOPMENT_DATABASE_URL: ${{ secrets.ALEA_DEVELOPMENT_DATABASE_URL }}
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/alea-dev-snapshot"
          mkdir -p "$snapshot_dir"
          trap 'rm -rf "$snapshot_dir"' EXIT
          docker run --rm \
            -e SOURCE_DATABASE_URL \
            -e DEVELOPMENT_DATABASE_URL \
            -v "$snapshot_dir:/snapshot" \
            postgres:17 bash -euc '
              set -o pipefail
              pg_dump --format=custom \
                --schema=public --schema=private \
                --dbname="$SOURCE_DATABASE_URL" \
                --file=/snapshot/application.dump
              pg_dump --format=custom --data-only \
                --table=auth.users --table=auth.identities \
                --dbname="$SOURCE_DATABASE_URL" \
                --file=/snapshot/auth.dump
              pg_restore --list /snapshot/application.dump >/dev/null
              pg_restore --list /snapshot/auth.dump >/dev/null
              pg_restore --no-owner --file=/snapshot/application.raw.sql /snapshot/application.dump
              pg_restore --no-owner --data-only --file=/snapshot/auth.sql /snapshot/auth.dump
            '
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "alea-dev-snapshot" / "application.raw.sql"
          sql = path.read_text()
          filtered, removed = re.subn(
              r'^CREATE SCHEMA (?:IF NOT EXISTS )?"?public"?;\s*\n?',
              '',
              sql,
              flags=re.MULTILINE | re.IGNORECASE,
          )
          if removed != 1:
              raise SystemExit(f"Expected exactly one public-schema creation statement; found {removed}. Import stopped.")
          filtered, defaults_removed = re.subn(
              r'^ALTER DEFAULT PRIVILEGES\b[^;]*;\s*\n?',
              '',
              filtered,
              flags=re.MULTILINE | re.IGNORECASE,
          )
          if defaults_removed < 1:
              raise SystemExit("Expected managed default-privilege statements; import stopped for review.")
          path.with_name("application.sql").write_text(filtered)
          auth_sql = path.with_name("auth.sql").read_text()
          path.with_name("combined.sql").write_text(auth_sql + "\n" + filtered)
          print("Prepared schema/data restore while preserving Supabase's existing public schema.")
          PY
          docker run --rm \
            -e DEVELOPMENT_DATABASE_URL \
            -v "$snapshot_dir:/snapshot" \
            postgres:17 bash -euc 'psql "$DEVELOPMENT_DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction --file=/snapshot/combined.sql'
          echo "Live public/private schema, application data, and email-auth users imported to development in one transaction. No live data was modified." >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm development database after import
        shell: bash
        env:
          DEVELOPMENT_DATABASE_URL: ${{ secrets.ALEA_DEVELOPMENT_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm -e DEVELOPMENT_DATABASE_URL postgres:17 \
            bash -euc 'psql "$DEVELOPMENT_DATABASE_URL" -X -v ON_ERROR_STOP=1 -qAt -c "SELECT current_setting('''server_version''') || ''' — dev database responds after snapshot.''';"' \
            >> "$GITHUB_STEP_SUMMARY"
