name: Cryptex mobile layout
on:
  push:
    branches: [main]
    paths:
      - 'features/combat/arcane-cryptex.css'
      - 'tests/cryptex-mobile-layout.test.js'
      - '.github/workflows/cryptex-mobile-layout.yml'
      - 'index.html'
  workflow_dispatch:
jobs:
  mobile-cryptex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/cryptex-mobile-layout.test.js
      - run: npm run build
