name: Skill Icon Frame QA
on:
  push:
    branches: [main]
    paths:
      - 'assets/skill-icons/klattra-frame-master.png'
      - 'scripts/skill_icon_compose.py'
      - 'tests/test_skill_icon_compose.py'
      - 'docs/SKILL_ICON_PRODUCTION.md'
      - '.github/workflows/skill-icon-composition-check.yml'
  pull_request:
    paths:
      - 'assets/skill-icons/klattra-frame-master.png'
      - 'scripts/skill_icon_compose.py'
      - 'tests/test_skill_icon_compose.py'
      - 'docs/SKILL_ICON_PRODUCTION.md'
      - '.github/workflows/skill-icon-composition-check.yml'
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed image codec
        run: python -m pip install Pillow==12.3.0
      - name: Assert master-frame compositing and low-resolution rejection
        run: python -m unittest discover -s tests -p 'test_skill_icon_compose.py' -v
