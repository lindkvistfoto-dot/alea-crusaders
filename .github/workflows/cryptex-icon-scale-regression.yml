name: Cryptex icon scale regression
on:
  push:
    branches: [fix/cryptex-spell-icon-scale-mobile-20261017]
    paths:
      - 'features/combat/spell-art.js'
      - 'features/combat/magic-carousel.js'
      - 'tests/cryptex-icon-crop.test.js'
      - '.github/workflows/cryptex-icon-scale-regression.yml'
  pull_request:
    paths:
      - 'features/combat/spell-art.js'
      - 'features/combat/magic-carousel.js'
      - 'tests/cryptex-icon-crop.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cryptex-image-sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify cryptex crop geometry and independent admin art
        run: npx vitest run tests/cryptex-icon-crop.test.js tests/spell-admin-icons.test.js
      - name: Check production build
        run: npm run build
