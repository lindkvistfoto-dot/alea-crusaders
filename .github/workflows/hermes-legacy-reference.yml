name: HERMES - Archive legacy skill reference
on:
  push:
    branches: [main]
    paths: ['hermes/reference-requests/klattra.json']
permissions:
  contents: write
jobs:
  reference:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive the actual existing Klattra illustration without changing its reference
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,hashlib,base64,time
          origin='https://wbmosmkirsitkonejzpg.supabase.co'
          secret=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          headers={'Authorization':'Bearer '+secret,'apikey':secret}
          def read(url,headers):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=40) as r:return r.read()
          rows=json.loads(read(origin+'/rest/v1/rule_skills?id=eq.klattra&select=id,illustration_path',headers))
          assert len(rows)==1 and rows[0]['id']=='klattra'
          source=rows[0]['illustration_path']
          assert source=='skill/klattra/illustration/456693fc-8673-42f7-9307-4c9f5bd76d2f.png'
          raw=read(origin+'/storage/v1/object/authenticated/alea-skill-art/'+source,headers)
          assert raw.startswith(b'\x89PNG\r\n\x1a\n') and len(raw)<=8388608
          sha=hashlib.sha256(raw).hexdigest()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          target='assets/hermes/references/skill/klattra/'+sha+'.png'
          api='https://api.github.com/repos/'+os.environ['GH_REPO']+'/contents/'+target
          gh={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          body=json.dumps({'message':'HERMES: archive actual legacy Klattra source reference','branch':'main','content':base64.b64encode(raw).decode()}).encode()
          for attempt in range(5):
              try:
                  existing=json.loads(read(api,gh))
                  assert existing['sha']==blob
                  break
              except urllib.error.HTTPError as e:
                  if e.code!=404:raise
              try:
                  response=urllib.request.urlopen(urllib.request.Request(api,data=body,headers=gh,method='PUT'),timeout=45)
                  result=json.load(response)
                  assert result['content']['sha']==blob
                  break
              except urllib.error.HTTPError as e:
                  if e.code!=409 or attempt==4:raise
                  time.sleep(2)
          else:raise RuntimeError('ARCHIVE_NOT_VERIFIED')
          print('HERMES_REFERENCE_VERIFIED',target,'sha256',sha,'bytes',len(raw))
          PY
