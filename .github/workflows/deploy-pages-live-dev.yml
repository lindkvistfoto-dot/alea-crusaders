name: Deploy Alea live and development to GitHub Pages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live app
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
          fetch-depth: 100
          persist-credentials: false

      - name: Check out development app
        uses: actions/checkout@v4
        with:
          ref: development
          path: development
          fetch-depth: 100
          persist-credentials: false

      - name: Assemble live root and development subpath
        run: |
          mkdir -p _site/dev
          rsync -a --delete --exclude='.git' live/ _site/
          rsync -a --delete --exclude='.git' development/ _site/dev/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/dev/index.html

      - name: Fetch both branch histories
        run: git -C live fetch --depth=100 --no-tags origin +refs/heads/development:refs/remotes/origin/development

      - name: Add source manifests and release reconciliation
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          LIVE_SHA="$(git -C live rev-parse main)"
          DEV_SHA="$(git -C live rev-parse origin/development)"
          echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
          mkdir -p _site/dev/olympia
          python3 - "$LIVE_SHA" "$DEV_SHA" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          live_sha, dev_sha = sys.argv[1:3]
          now = datetime.now(timezone.utc).isoformat()
          with open("_site/deployment-manifest.json", "w") as f:
              json.dump({"environment":"main","source_sha":live_sha,"generated_at":now}, f)
          with open("_site/dev/deployment-manifest.json", "w") as f:
              json.dump({"environment":"development","source_sha":dev_sha,"generated_at":now}, f)
          PY
          node development/scripts/olympia-release-guard.mjs --repo live --live-ref main --development-ref origin/development --output _site/dev/olympia/release-status.json
          {
            echo "## OLYMPIA release manifest"
            echo "- LIVE source SHA: $LIVE_SHA"
            echo "- DEV source SHA: $DEV_SHA"
            echo "- Reconciliation: _site/dev/olympia/release-status.json"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - _site/dev/olympia/release-status.json <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          data = json.load(open(sys.argv[1]))
          print("\\n### Release reconciliation")
          print(f"- Status: **{data.get('status', 'unknown')}**")
          print(f"- Merge base: {data.get('merge_base', 'unknown')}")
          print(f"- PRs waiting for LIVE: {len(data.get('pending_prs', []))}")
          for pr in data.get("pending_prs", []):
              print(f"  - #{pr['number']} {pr['title']} ({pr['mergeSha'][:7]})")
          print(f"- LIVE-only commits: {len(data.get('live_only_commits', []))}")
          for commit in data.get("live_only_commits", []):
              print(f"  - {commit['sha'][:7]} {commit['message']} [{commit['reconciliation']}]")
          print(f"- Database migrations waiting: {len(data.get('database_changes', {}).get('waiting_for_live', []))}")
          for name in data.get("database_changes", {}).get("waiting_for_live", []):
              print(f"  - {name}")
          print(f"- Rollback reference: LIVE source SHA {data.get('live', {}).get('sha', 'unknown')}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed source manifests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_LIVE_SHA: ${{ steps.manifest.outputs.live_sha }}
          EXPECTED_DEV_SHA: ${{ steps.manifest.outputs.dev_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          expected = {
              "deployment-manifest.json": ("main", os.environ["EXPECTED_LIVE_SHA"]),
              "dev/deployment-manifest.json": ("development", os.environ["EXPECTED_DEV_SHA"]),
          }
          for path, (environment, expected_sha) in expected.items():
              with urllib.request.urlopen(base + "/" + path, timeout=20) as response:
                  manifest = json.load(response)
              if manifest.get("environment") != environment or manifest.get("source_sha") != expected_sha:
                  raise SystemExit(f"Invalid or stale {environment} deployment manifest")
              print(f"Verified {environment}: {manifest['source_sha']}")
          with open("_site/release-verification.json", "w") as f:
              json.dump({"status":"verified","checked_at":__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),"page_url":base}, f)
          PY

      - name: Archive release journal
        uses: actions/upload-artifact@v4
        with:
          name: release-journal-${{ github.run_id }}
          path: |
            _site/deployment-manifest.json
            _site/dev/deployment-manifest.json
            _site/dev/olympia/release-status.json
            _site/release-verification.json
          retention-days: 90
