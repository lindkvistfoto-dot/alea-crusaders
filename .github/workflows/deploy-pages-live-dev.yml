name: Deploy Alea LIVE to GitHub Pages

on:
  push:
    branches:
      - main
    # GitHub Pages deploys only the main/LIVE artifact; DEV is built by the Cloudflare development branch.
    paths-ignore:
      - 'hermes/core/queue/dev/**'
      - '.github/workflows/deploy-pages-live-dev.yml'
      - '.github/workflows/hermes-alea.yml'
      - 'supabase/migrations/**'
      - '.github/workflows/alea-dev-pages-e2e.yml'
      - 'scripts/alea-dev-pages-e2e.mjs'
      - 'scripts/alea-dev-admin-provision.mjs'
      - 'docs/testing/ALEA_DEV_PAGES_E2E.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-live
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out LIVE app
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: live
          fetch-depth: 100
          persist-credentials: false

      - name: Promote OLYMPIA HERMES CORE images before LIVE Pages deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          LIVE_BEFORE: ${{ github.event.before }}
          LIVE_SHA: ${{ github.sha }}
          SUPABASE_DEV_URL: https://wkiuyklzzroavclnsxna.supabase.co
          SUPABASE_LIVE_URL: https://wbmosmkirsitkonejzpg.supabase.co
        shell: bash
        run: |
          set -euo pipefail
          [[ "$LIVE_BEFORE" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::LIVE predecessor is unavailable; image promotion cannot be scoped safely."; exit 1; }
          mapfile -t manifests < <(git -C live diff --diff-filter=AM --name-only "$LIVE_BEFORE" "$LIVE_SHA" -- 'olympia/release-manifests/*.json')
          if (( ${#manifests[@]} == 0 )); then
            echo "No OLYMPIA image manifest changed; image promotion skipped."
            exit 0
          fi
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::The existing Supabase management connection is unavailable; LIVE deployment stopped before publication."; exit 1; }
          resolve_service_key() {
            local project="$1"
            local response key
            response="$(curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Accept: application/json" \
              --data-urlencode "reveal=true" \
              "https://api.supabase.com/v1/projects/$project/api-keys")"
            key="$(jq -er '[.[] | select(.name == "service_role") | .api_key][0] // empty' <<< "$response")"
            unset response
            [[ "$key" == eyJ* ]] || { echo "::error::Supabase did not return the required project service key."; return 1; }
            echo "$key"
          }
          DEV_KEY="$(resolve_service_key wkiuyklzzroavclnsxna)"
          LIVE_KEY="$(resolve_service_key wbmosmkirsitkonejzpg)"
          echo "::add-mask::$DEV_KEY"
          echo "::add-mask::$LIVE_KEY"
          export SUPABASE_DEV_SERVICE_ROLE_KEY="$DEV_KEY"
          export SUPABASE_LIVE_SERVICE_ROLE_KEY="$LIVE_KEY"
          unset DEV_KEY LIVE_KEY
          ARGS=()
          for manifest in "${manifests[@]}"; do
            ARGS+=("live/$manifest")
          done
          node "live/scripts/olympia/promote-core-assets.mjs" "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Assemble LIVE root
        run: |
          mkdir -p _site
          rsync -a --delete --exclude='.git' live/ _site/
          node live/scripts/isolate-live-pages.mjs _site
          touch _site/.nojekyll
          test -s _site/index.html

      - name: Version CSS and JavaScript from published file contents
        run: python3 live/scripts/version-pages-assets.py _site

      - name: Add LIVE source manifest
        id: manifest
        env:
          LIVE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          python3 - "$LIVE_SHA" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          with open("_site/deployment-manifest.json", "w") as f:
              json.dump({"environment":"main","source_sha":sys.argv[1],"generated_at":datetime.now(timezone.utc).isoformat()}, f)
          PY
          echo "- LIVE source SHA: $LIVE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify deployed source manifests
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_LIVE_SHA: ${{ steps.manifest.outputs.live_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          base = os.environ["PAGE_URL"].rstrip("/")
          expected = {
              "deployment-manifest.json": ("main", os.environ["EXPECTED_LIVE_SHA"]),
              }
          for path, (environment, expected_sha) in expected.items():
              with urllib.request.urlopen(base + "/" + path, timeout=20) as response:
                  manifest = json.load(response)
              if manifest.get("environment") != environment or manifest.get("source_sha") != expected_sha:
                  raise SystemExit(f"Invalid or stale {environment} deployment manifest")
              print(f"Verified {environment}: {manifest['source_sha']}")
          PY

      - name: Archive release journal
        uses: actions/upload-artifact@v4
        with:
          name: release-journal-${{ github.run_id }}
          path: |
            _site/deployment-manifest.json
          retention-days: 90
