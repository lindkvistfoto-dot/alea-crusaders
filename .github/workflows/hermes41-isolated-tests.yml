name: HERMES 4.1 replacement regression tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hermes41-isolated-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hermes41-pose-replacement
          sparse-checkout: |
            scripts/hermes_web_worker.py
            tests/test_hermes_web_worker.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Run all nine individually and report each outcome
        shell: bash
        run: |
          failed=0
          for test in test_digest_stable test_no_job_claim_if_oauth_fails test_archive_reused_and_verified test_corrupt_archive_never_published test_recover_already_published_pose test_recover_orphaned_drive_file test_ambiguous_archive_fails_closed test_corrupt_orphan_archive_fails_closed test_corrupt_image_never_archived test_replacement_keeps_old_pose_until_verified; do
            echo "::group::$test"
            if python -m unittest discover -s tests -p test_hermes_web_worker.py -k "$test" -v; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "TOTAL_FAILED=$failed"
          test "$failed" -eq 0
