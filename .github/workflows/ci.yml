name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Enforce HERMES ALEA publishing boundary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read = path => readFileSync(path, 'utf8');
          const requireText = (path, text) => {
            if (!read(path).includes(text)) throw new Error(`Missing HERMES ALEA contract in ${path}: ${text}`);
          };
          const forbid = (path, pattern, label) => {
            if (pattern.test(read(path))) throw new Error(`Forbidden HERMES ALEA pattern in ${path}: ${label}`);
          };
          requireText('AGENTS.md', 'HERMES ALEA är den enda standarden');
          requireText('docs/hermes-alea/DECISIONS.md', '## Binding architecture lock');
          requireText('features/equipment/art.js', 'window.aleaHermesAssetResolver?.url(value)');
          requireText('legacy/app.js', 'window.aleaHermesAssetResolver?.reference(rule)');
          requireText('features/honors/honors-image-resolver.js', 'urlForRecord(record)');
          forbid('features/equipment/weapon-hermes-alea.js', /alea-equipment-art|\/storage\/v1\/object\//, 'legacy mirror or direct Storage write');
          forbid('features/hermes-alea/client.js', /displayBlob/, 'legacy display bytes exposed to target adapters');
          const app = read('legacy/app.js');
          const save = app.slice(app.indexOf("async function saveRuleWeapon(id=''){"), app.indexOf("\nasync function deleteRuleWeapon", app.indexOf("async function saveRuleWeapon(id=''){")));
          if (!save || save.includes('compatibilityPath') || /PATCH.{0,160}image_path/s.test(save)) throw new Error('Weapon saves must let HERMES ALEA finalize image_asset_id; image_path is read-only.');
          NODE
      - name: Test all suites except MINOTAURUS-owned focused suites
        run: >-
          npx vitest run
          --exclude tests/minotaurus-publisher.test.mjs
          --exclude tests/hermes4-batch-publisher.test.mjs
          --exclude tests/hermes-system-assets-publisher.test.mjs
          --exclude tests/arcane-paper-doll-assets.test.js
          --exclude tests/arcane-system-assets-rls.test.mjs
          --exclude tests/hermes-wide-publisher.test.mjs
          --exclude tests/hermes-spell-cutout-profile.test.js
          --exclude tests/hermes-v2-gates.test.mjs
          --exclude tests/arcane-gallery-release-smoke.test.js
          --exclude tests/arcane-morph-art-assets.test.js
      - name: Build
        run: npm run build
