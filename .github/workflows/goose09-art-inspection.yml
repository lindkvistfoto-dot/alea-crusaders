name: GOOSE 09 visual art inspection
on:
  push:
    branches: [sisyphus/goose09-sword-and-phase-correction-20261017]
    paths: ['scripts/goose09_inspect_art.py', '.github/workflows/goose09-art-inspection.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==12.0.0
      - run: python scripts/goose09_inspect_art.py
