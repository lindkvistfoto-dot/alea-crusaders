name: ARCANE IVORY optimize and publish
on:
  push:
    branches: [main]
    paths:
      - 'assets/spells/arcane-ivory/*.png'
      - 'scripts/optimize_arcane_ivory.py'
      - 'scripts/publish_arcane_ivory.mjs'
      - '.github/workflows/arcane-ivory-optimize.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: arcane-ivory-art-pipeline
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image codec
        run: python -m pip install Pillow==12.3.0
      - name: Generate compact transparent WebP files
        run: python scripts/optimize_arcane_ivory.py --write
      - name: Verify reproducible output
        run: python scripts/optimize_arcane_ivory.py --check
      - name: Commit only optimized app files via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish_arcane_ivory.mjs
