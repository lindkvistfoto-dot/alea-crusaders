name: Desktop Combat Art Viewer verification
on:
  push:
    branches: [feature/combat-desktop-art-viewer-20261017]
    paths:
      - 'features/combat/art-viewer.js'
      - 'features/combat/art-viewer.css'
      - 'features/combat/runtime.js'
      - 'features/combat/magic-carousel.js'
      - 'tests/combat-art-viewer.test.js'
      - 'tests/fixtures/combat-art-viewer-desktop.html'
      - 'scripts/combat_art_viewer_visual.cjs'
      - 'index.html'
      - '.github/workflows/combat-art-viewer.yml'
  pull_request:
    paths:
      - 'features/combat/art-viewer.js'
      - 'features/combat/art-viewer.css'
      - 'features/combat/runtime.js'
      - 'features/combat/magic-carousel.js'
      - 'tests/combat-art-viewer.test.js'
      - 'tests/fixtures/combat-art-viewer-desktop.html'
      - 'scripts/combat_art_viewer_visual.cjs'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --no-audit --no-fund
      - name: Gallery controls, security and rendering tests
        run: npx vitest run tests/combat-art-viewer.test.js tests/cryptex-icon-crop.test.js tests/cryptex-mobile-layout.test.js
      - name: Production build
        run: npm run build
      - name: Desktop and mobile Chromium smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/alea-combat-gallery.log 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/tests/fixtures/combat-art-viewer-desktop.html >/dev/null; then break; fi
            sleep 1
          done
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/combat_art_viewer_visual.cjs
      - name: Save review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-combat-image-gallery
          path: tests/visual-regressions/combat-art-viewer/*.png
          if-no-files-found: ignore
