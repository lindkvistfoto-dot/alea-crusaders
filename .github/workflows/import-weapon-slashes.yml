name: Import Cethiel CC0 slash sprites
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-weapon-slashes.py'
      - '.github/workflows/import-weapon-slashes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - name: Fetch pinned CC0 ZIP and construct 20 atlas PNG files
        run: python scripts/import-weapon-slashes.py
      - name: Commit imported images to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/combat/slashes
          if ! git diff --cached --quiet; then
            git commit -m "assets(combat): install 20 CC0 Cethiel weapon slash sprite strips"
            git push origin HEAD:main
          else
            echo "Sprite files already up to date."
          fi
