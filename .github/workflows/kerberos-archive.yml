name: KERBEROS synthetic archive checks

on:
  pull_request:
    paths:
      - scripts/kerberos_archive.py
      - scripts/kerberos_pilot_simulate.py
      - scripts/requirements-kerberos.txt
      - tests/test_kerberos_archive.py
      - docs/kerberos/pilot-20261020/**
      - .github/workflows/kerberos-archive.yml
  push:
    branches: ['artemis/kerberos-*']
    paths:
      - scripts/kerberos_archive.py
      - scripts/kerberos_pilot_simulate.py
      - scripts/requirements-kerberos.txt
      - tests/test_kerberos_archive.py
      - docs/kerberos/pilot-20261020/**
      - .github/workflows/kerberos-archive.yml

permissions:
  contents: read

jobs:
  synthetic-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            config
            docs/kerberos
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-kerberos.txt
      - run: python -m unittest discover -s tests -p 'test_kerberos_archive.py' -v
      - name: Simulate five-file pilot with synthetic bytes and blocked sockets
        run: python scripts/kerberos_pilot_simulate.py --plan docs/kerberos/pilot-20261020/KERBEROS_PILOT_PLAN.json --output "$RUNNER_TEMP/KERBEROS_PILOT_SIMULATION.json"
