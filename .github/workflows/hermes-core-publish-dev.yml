name: HERMES CORE – DEV image publication

on:
  push:
    branches: [development]
    paths:
      - 'hermes/core/queue/dev/**'

permissions:
  contents: write
  id-token: write

concurrency:
  group: hermes-core-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            config/hermes-drive-folders.json
            config/hermes-system-assets.json
            features/hermes-core
            hermes/core/queue/dev
            scripts/hermes_system_assets.py
            scripts/hermes_core_prepare.py
            scripts/hermes_core_publish.ts
            scripts/hermes_publication_environment.js
            scripts/olympia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/303776456341/locations/global/workloadIdentityPools/github/providers/alea-hermes
          service_account: hermes-transfer@alea-hermes.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false
      - name: Resolve the DEV service-role key using the existing Supabase connection
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::Existing Supabase management connection is unavailable."; exit 1; }
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            --data-urlencode "reveal=true" \
            "https://api.supabase.com/v1/projects/wkiuyklzzroavclnsxna/api-keys")"
          key="$(jq -er '[.[] | select(.name == "service_role") | .api_key][0] // empty' <<< "$response")"
          unset response
          [[ "$key" == eyJ* ]] || { echo "::error::Supabase did not return a DEV service-role key."; exit 1; }
          echo "::add-mask::$key"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          unset key
      - name: Prepare and publish changed DEV requests
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GITHUB_TOKEN: ${{ github.token }}
          HERMES_TARGET_ENV: DEV
          SUPABASE_URL: https://wkiuyklzzroavclnsxna.supabase.co
          HERMES_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "${HERMES_BEFORE}^{commit}" 2>/dev/null; then
            echo "::error::Push predecessor unavailable"; exit 1
          fi
          mapfile -t requests < <(git diff --name-only --diff-filter=AM "$HERMES_BEFORE" "$GITHUB_SHA" -- hermes/core/queue/dev/)
          if [ "${#requests[@]}" -eq 0 ]; then
            echo "::error::No DEV CORE queue request found"; exit 1
          fi
          for request in "${requests[@]}"; do
            if [[ ! "$request" =~ ^hermes/core/queue/dev/[a-z0-9][a-z0-9-]{0,99}\.json$ ]]; then
              echo "::error::Invalid DEV CORE queue path"; exit 1
            fi
            output="$RUNNER_TEMP/hermes-core-dev/${request##*/}"
            mkdir -p "$output"
            python scripts/hermes_core_prepare.py "$request" --output "$output"
            deno run --no-config --no-lock --node-modules-dir=none \
              --allow-env --allow-net --allow-read="$output" --allow-write="$output" \
              scripts/hermes_core_publish.ts "$output"
            node scripts/olympia/register-core-image.mjs "$output/publication.json"
          done
