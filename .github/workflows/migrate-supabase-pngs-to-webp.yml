name: Convert archived Supabase PNGs to WebP

on:
  push:
    branches:
      - development
    paths:
      - ops/storage-cleanup/migrate-pngs-to-webp-20261029.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-png-webp-migration-20261029
  cancel-in-progress: false

jobs:
  convert:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the scoped conversion script
        uses: actions/checkout@v4
        with:
          ref: development
          sparse-checkout: |
            scripts/migrate_supabase_pngs_to_webp.py
      - name: Set up Python and WebP conversion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image conversion dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Upload and verify WebP siblings
        env:
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          MIGRATION_DIR: ${{ runner.temp }}/png-webp-migration
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing HERMES_SUPABASE_SERVICE_ROLE_KEY"; exit 1
          fi
          python scripts/migrate_supabase_pngs_to_webp.py
      - name: Save conversion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-png-webp-conversion-report
          path: ${{ runner.temp }}/png-webp-migration/
          if-no-files-found: warn
          retention-days: 14
