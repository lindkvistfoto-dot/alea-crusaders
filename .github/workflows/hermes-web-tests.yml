name: HERMES 4.1 – Offline QA
on:
  pull_request:
    paths:
      - 'scripts/hermes_web_worker.py'
      - 'tests/test_hermes_web_worker.py'
      - '.github/workflows/hermes-web-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m py_compile scripts/hermes_web_worker.py
      - run: python -m unittest discover -s tests -p test_hermes_web_worker.py -v
