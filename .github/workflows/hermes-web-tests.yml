name: HERMES 4.1 – Offline QA
on:
  pull_request:
    paths:
      - 'scripts/hermes_web_worker.py'
      - 'scripts/hermes_asset_worker.py'
      - 'tests/test_hermes_web_worker.py'
      - 'tests/test_hermes_asset_worker.py'
      - 'supabase/functions/hermes-inbox-bridge/**'
      - 'supabase/migrations/*hermes_asset_inbox_bridge.sql'
      - '.github/workflows/hermes-web-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m py_compile scripts/hermes_web_worker.py
      - run: python -m unittest discover -s tests -p test_hermes_web_worker.py -v
      - run: python -m py_compile scripts/hermes_asset_worker.py
      - run: python -m unittest discover -s tests -p test_hermes_asset_worker.py -v
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-config --no-lock --node-modules-dir=none supabase/functions/hermes-inbox-bridge/index.ts
