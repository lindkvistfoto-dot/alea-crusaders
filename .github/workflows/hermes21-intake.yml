name: HERMES 2.1 – Verify and optimize incoming art

on:
  push:
    branches: [main]
    paths:
      - 'assets/hermes/originals/**/*.png'
      - 'scripts/hermes2_prepare.py'
      - '.github/workflows/hermes21-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes21-intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install Pillow==12.3.0
      - name: Verify source and create content-addressed WebP
        run: python scripts/hermes2_prepare.py --output "$RUNNER_TEMP/hermes21-output"
      - name: Archive the optimized asset for the HERMES publisher
        uses: actions/upload-artifact@v4
        with:
          name: hermes21-verified-images
          path: ${{ runner.temp }}/hermes21-output/
          retention-days: 7
          if-no-files-found: error
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck HERMES publisher
        run: deno check --node-modules-dir=auto scripts/hermes2_publish.ts
      - name: Publish safely to Supabase when service key is configured
        env:
          SUPABASE_URL: https://wbmosmkirsitkonejzpg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HERMES_SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::HERMES 2.1 is prepared but NOT active: add repository secret HERMES_SUPABASE_SERVICE_ROLE_KEY for automatic Supabase publication."
            echo "### HERMES: prepared, awaiting Supabase credential" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          deno run -A --node-modules-dir=auto scripts/hermes2_publish.ts "$RUNNER_TEMP/hermes21-output/manifest.json" "$RUNNER_TEMP/hermes21-output"
          echo "### HERMES: image verified and activated in Supabase" >> "$GITHUB_STEP_SUMMARY"
