name: HERMES ALEA – deploy verifier to DEV

on:
  push:
    branches: [development, fix/hermes-alea-staging-recovery]
    paths:
      - 'supabase/functions/hermes-alea/**'
      - 'scripts/hermes-alea-prepare-edge.mjs'
      - 'package-lock.json'
      - '.github/workflows/hermes-alea-deploy-dev.yml'

permissions:
  contents: read

concurrency:
  group: hermes-alea-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/fix/hermes-alea-staging-recovery')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check existing Supabase deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Existing SUPABASE_ACCESS_TOKEN is unavailable"
            exit 1
          fi
      - run: npm ci
      - name: Package approved local WASM verifier
        run: node scripts/hermes-alea-prepare-edge.mjs
      - name: Validate packaged binary
        run: python3 -c "from pathlib import Path; p=Path('supabase/functions/hermes-alea/magick.wasm'); assert p.is_file() and p.stat().st_size > 100000"
      - name: Deploy isolated function to the fixed DEV project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --yes supabase@2.81.3 functions deploy hermes-alea --project-ref wkiuyklzzroavclnsxna
