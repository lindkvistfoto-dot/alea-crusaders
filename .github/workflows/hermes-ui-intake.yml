name: HERMES UI – verify, optimize and publish cryptex graphics
on:
  workflow_dispatch:
    inputs:
      source_path:
        description: Verified immutable HERMES UI PNG source path
        required: true
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: hermes-ui-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lindkvistfoto-dot/alea-crusaders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Verify immutable PNG and prepare optimized WebP
        env:
          HERMES_SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          if [[ ! "$HERMES_SOURCE_PATH" =~ ^assets/hermes/originals/ui/(arcane-mechanism-link|arcane-mechanism-chamber|arcane-gallery-overlay|arcane-gallery-goose-left|arcane-gallery-goose-right|arcane-gallery-goose-seal)/[a-f0-9]{64}\.png$ ]]; then
            echo "::error::Invalid HERMES UI source path"; exit 1
          fi
          python scripts/hermes_ui_prepare.py --source "$HERMES_SOURCE_PATH"
          echo "HERMES_UI_KEY=$(basename "$(dirname "$HERMES_SOURCE_PATH")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified app WebP via Git Data API and request Pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish_hermes_ui.mjs
