name: OLYMPIA candidate preview
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact release candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Cloudflare configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "::error::Cloudflare credentials unavailable; no deployment attempted."
            exit 1
          fi
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify candidate commit
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Deploy exact candidate to Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ inputs.candidate_sha }}
        run: |
          npx --yes wrangler@4.45.0 pages deploy dist --project-name=alea-crusaders --branch="candidate-$SHA" --commit-hash="$SHA"
