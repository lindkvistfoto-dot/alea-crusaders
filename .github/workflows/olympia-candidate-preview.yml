name: OLYMPIA candidate preview
on:
  push:
    branches:
      - 'olympia/pr-*/issue-*-live-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload isolated candidate build
        uses: actions/upload-artifact@v4
        with:
          name: olympia-candidate-preview
          path: dist/
