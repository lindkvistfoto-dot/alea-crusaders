name: SKYLLA synthetic archive checks
on:
  pull_request:
    paths:
      - scripts/skylla_archive.py
      - scripts/skylla_edge_plan.py
      - scripts/skylla_operator_verify.mjs
      - supabase/functions/skylla-verify/**
      - tests/skylla_edge_checks.mjs
      - tests/test_skylla_edge_plan.py
      - tests/test_skylla_archive.py
      - config/skylla-fast-track-policy.json
      - .github/workflows/skylla-archive.yml
  push:
    branches: ['artemis/skylla-*']
    paths:
      - scripts/skylla_archive.py
      - scripts/skylla_edge_plan.py
      - scripts/skylla_operator_verify.mjs
      - supabase/functions/skylla-verify/**
      - tests/skylla_edge_checks.mjs
      - tests/test_skylla_edge_plan.py
      - tests/test_skylla_archive.py
      - config/skylla-fast-track-policy.json
      - .github/workflows/skylla-archive.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
            config
            supabase/functions/skylla-verify
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-kerberos.txt
      - run: python -m unittest discover -s tests -p 'test_skylla_archive.py' -v
      - run: python -m unittest discover -s tests -p 'test_kerberos_archive.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_edge_plan.py' -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node tests/skylla_edge_checks.mjs
