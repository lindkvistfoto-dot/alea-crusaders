name: SKYLLA synthetic archive checks
on:
  pull_request:
    paths:
      - scripts/skylla_archive.py
      - scripts/skylla_edge_plan.py
      - scripts/skylla_reconcile.py
      - scripts/skylla_scoped_verify.py
      - scripts/skylla_display_verify.py
      - scripts/skylla_delete_pilot.py
      - scripts/skylla_batch.py
      - scripts/skylla_mobile.py
      - supabase/functions/skylla-mobile/**
      - tests/skylla_mobile_checks.mjs
      - tests/test_skylla_mobile.py
      - config/skylla-mobile-batches.json
      - .github/workflows/skylla-mobile.yml
      - supabase/functions/skylla-batch/**
      - tests/skylla_batch_checks.mjs
      - tests/test_skylla_batch.py
      - supabase/functions/skylla-delete-pilot/**
      - tests/skylla_delete_checks.mjs
      - tests/test_skylla_delete_pilot.py
      - supabase/functions/skylla-display-read/**
      - supabase/functions/skylla-verify-scoped/**
      - scripts/skylla_operator_verify.mjs
      - supabase/functions/skylla-verify/**
      - tests/skylla_edge_checks.mjs
      - tests/test_skylla_edge_plan.py
      - tests/test_skylla_reconcile.py
      - tests/test_skylla_scoped_verify.py
      - tests/test_skylla_display_verify.py
      - tests/test_skylla_archive.py
      - config/skylla-fast-track-policy.json
      - config/hermes-drive-folders.json
      - docs/skylla/SKYLLA_ACCESS_AND_RESTORE.md
      - .github/workflows/skylla-archive.yml
  push:
    branches: ['artemis/skylla-*']
    paths:
      - scripts/skylla_archive.py
      - scripts/skylla_edge_plan.py
      - scripts/skylla_reconcile.py
      - scripts/skylla_scoped_verify.py
      - scripts/skylla_display_verify.py
      - scripts/skylla_delete_pilot.py
      - scripts/skylla_batch.py
      - scripts/skylla_mobile.py
      - supabase/functions/skylla-mobile/**
      - tests/skylla_mobile_checks.mjs
      - tests/test_skylla_mobile.py
      - config/skylla-mobile-batches.json
      - .github/workflows/skylla-mobile.yml
      - supabase/functions/skylla-batch/**
      - tests/skylla_batch_checks.mjs
      - tests/test_skylla_batch.py
      - supabase/functions/skylla-delete-pilot/**
      - tests/skylla_delete_checks.mjs
      - tests/test_skylla_delete_pilot.py
      - supabase/functions/skylla-display-read/**
      - supabase/functions/skylla-verify-scoped/**
      - scripts/skylla_operator_verify.mjs
      - supabase/functions/skylla-verify/**
      - tests/skylla_edge_checks.mjs
      - tests/test_skylla_edge_plan.py
      - tests/test_skylla_reconcile.py
      - tests/test_skylla_scoped_verify.py
      - tests/test_skylla_display_verify.py
      - tests/test_skylla_archive.py
      - config/skylla-fast-track-policy.json
      - config/hermes-drive-folders.json
      - docs/skylla/SKYLLA_ACCESS_AND_RESTORE.md
      - .github/workflows/skylla-archive.yml
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            scripts
            tests
            config
            docs/skylla
            supabase/functions/skylla-verify
            supabase/functions/skylla-verify-scoped
            supabase/functions/skylla-display-read
            supabase/functions/skylla-delete-pilot
            supabase/functions/skylla-batch
            supabase/functions/skylla-mobile
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-kerberos.txt
      - run: python -m unittest discover -s tests -p 'test_skylla_archive.py' -v
      - run: python -m unittest discover -s tests -p 'test_kerberos_archive.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_edge_plan.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_reconcile.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_scoped_verify.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_display_verify.py' -v
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node tests/skylla_edge_checks.mjs
      - run: node tests/skylla_delete_checks.mjs
      - run: python -m unittest discover -s tests -p 'test_skylla_delete_pilot.py' -v
      - run: python -m unittest discover -s tests -p 'test_skylla_batch.py' -v
      - run: node tests/skylla_batch_checks.mjs
      - run: python -m unittest discover -s tests -p 'test_skylla_mobile.py' -v
      - run: node tests/skylla_mobile_checks.mjs
