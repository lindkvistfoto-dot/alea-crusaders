<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ARCANE PARTY PANEL · ALEA CRUSADERS</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <header>
    <div><div class="game">ALEA CRUSADERS</div><h1>Spelarlistan</h1></div>
    <fieldset id="sizes"><legend>Deltagare</legend></fieldset>
  </header>
  <section class="stage" aria-label="Kartprov med infällbar spelarlista">
    <div class="map" role="img" aria-label="Kryptans stenlagda salar"></div>
    <div class="scene-label"><span>Kartprov</span><strong>Kryptan</strong></div>
    <div id="partyMount"></div>
  </section>
  <footer>
    <ul aria-label="Statuslampor"><li data-lamp="GREEN">På plats</li><li data-lamp="YELLOW">Annan vy</li><li data-lamp="RED">Frånkopplad</li></ul>
    <button id="send" type="button">Simulera brev</button>
  </footer>
  <output id="notice" aria-live="polite"></output>
</main>
<script type="module" src="panel.js"></script>
</body>
</html>
