<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcane Geometry Lab</title><style>body{margin:0;background:#161b22;color:#f1e6d0;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:24px}section{background:#222b35;border:1px solid #5c4934;border-radius:16px;padding:20px;margin:18px 0}label{display:inline-flex;gap:12px;align-items:center;margin:8px 20px 8px 0}select,input,button{background:#313e4b;color:#fff;border:1px solid #a98b57;border-radius:7px;padding:9px}button{cursor:pointer}#stage{background:#10151c;border-radius:12px;min-height:350px;display:grid;place-items:center;overflow:hidden}#stage svg{width:95%;max-height:440px}#stage polygon{vector-effect:non-scaling-stroke}small{color:#b9ae9d}</style></head><body><main><h1>OPERATION HEXAGONIA · Geometry Lab V1</h1><p>Matematisk geometri, fast ortografisk kamera, transparent SVG. Ingen AI-genererad bas.</p><section><label>Formation <select id="pattern"><option value="1-2-1">4 · 1–2–1</option><option value="1-2">3 · 1–2</option><option value="1-2-3">6 · 1–2–3</option><option value="1-2-2-1">6 · 1–2–2–1</option><option value="2-3-2">7 · 2–3–2</option><option value="1-2-3-2-1">9 · 1–2–3–2–1</option></select></label><label>Rotation <select id="rotation"><option value="0">0°</option><option value="1">60°</option><option value="2">120°</option><option value="3">180°</option><option value="4">240°</option><option value="5">300°</option></select></label><label><input id="mirror" type="checkbox"> Spegla</label><label>High Angle <input id="elevation" type="range" min="25" max="85" value="55" step="1"><output id="elevValue">55°</output></label></section><section><div id="stage"></div><p id="status"></p><button id="download">Exportera transparent SVG</button> <button id="manifest">Exportera geometrimetadata</button></section><small>QA: rutnätskontakt och lika stora hexagoner kontrolleras matematiskt. Ornament och 3D-sidoväggar tillkommer i nästa fas.</small></main><script src="/features/ui/arcane-geometry-engine.js"></script><script>const e=globalThis.aleaArcaneGeometryEngine;const $=id=>document.getElementById(id);let markup='';function render(){const rows=$('pattern').value.split('-').map(Number);const opts={steps:Number($('rotation').value),mirror:$('mirror').checked,camera:{elevationDegrees:Number($('elevation').value)}};const g=e.geometry(rows,opts);markup=e.svg(rows,opts);$('stage').innerHTML=markup;$('elevValue').textContent=opts.camera.elevationDegrees+'°';const qa=e.audit(rows,opts);$('status').textContent=g.check.count+' hexagoner · '+(qa.valid?'QA GODKÄND':'QA UNDERKÄND')+' · yttre kanter '+qa.outerEdges+' · storleksavvikelse '+(100*Math.max(qa.maxWidthError,qa.maxHeightError)).toFixed(5)+' % · centrumavvikelse '+(100*qa.maxSpacingError).toFixed(5)+' % · rotation '+opts.steps*60+'°';}for(const id of ['pattern','rotation','mirror','elevation'])$(id).addEventListener('input',render);$('download').addEventListener('click',()=>{const blob=new Blob([markup],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='arcane-geometry-'+$('pattern').value+'.svg';a.click();URL.revokeObjectURL(url)});$('manifest').addEventListener('click',()=>{const rows=$('pattern').value.split('-').map(Number);const opts={steps:Number($('rotation').value),mirror:$('mirror').checked,camera:{elevationDegrees:Number($('elevation').value)}};const data=JSON.stringify(e.manifest(rows,opts),null,2);const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='hexagonia-'+$('pattern').value+'.json';a.click();URL.revokeObjectURL(url)});render();</script></body></html>
